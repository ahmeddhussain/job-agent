# ---------------------------------------------------------------------------
# Troubleshooting stories: strong material for support/monitoring cover letters.
stories:
  - id: story_oidc
    text: GitHub Actions could not assume its AWS role through OIDC; decoded the live JWT, found GitHub embeds immutable numeric IDs in the sub claim, and fixed the trust-policy wildcard with Terraform replace().
  - id: story_ntp
    text: Terraform failed with AWS AuthFailure; traced it to about 14 minutes of clock skew on a machine where outbound UDP 123 (NTP) was blocked, and corrected the time with HTTP-based sync.
  - id: story_ssa
    text: kube-prometheus-stack would not sync in ArgoCD; the root cause was the 262144-byte annotation size limit, fixed with ServerSideApply.
  - id: story_operator
    text: Prometheus Operator cached "CRDs don't exist" at startup; fixed with a rollout restart after the CRDs were installed.
  - id: story_systemd
    text: systemctl crashed on a RHEL VPN gateway after installing wireguard-tools because of a systemd/OpenSSL version mismatch between the image and the repositories; fixed by adding a fleet-wide patch playbook that runs before anything else.

