projects:
  - id: nexora
    name: Nexora Core Banking Platform on AWS
    link: https://github.com/Nexora-Banking-App/Nexora-Banking-App
    stack: Terraform, CloudFormation, AWS (EKS, RDS MySQL, ECR, ALB, Secrets Manager), GitHub Actions (OIDC), ArgoCD, Argo Rollouts, Kustomize, Istio, Kafka (Strimzi, KRaft), External Secrets Operator (IRSA), Trivy, Cosign, Prometheus, Alertmanager, Grafana, Loki, Fluent Bit, Tempo, OpenTelemetry, Backstage, Python (FastAPI, Pytest), NGINX
    status: done
    bullets:
      - id: nexora_services
        text: Built a core-banking platform of six services (five Python/FastAPI microservices and an NGINX frontend) for accounts, authentication, transfers and fraud scoring, split across five repositories so each CI/CD job gets only the permissions it needs.
        tags: [microservices, python, fastapi, architecture, security]
        status: done
      - id: nexora_concurrency
        text: Engineered transfers for correctness under concurrency with a two-phase lease, monotonic fencing tokens, row locks taken in ascending account-ID order to rule out deadlocks, and takeover of a crashed worker's lease after 10 seconds.
        tags: [architecture, mysql, sql, reliability]
        status: done
      - id: nexora_outbox
        text: Published transfer events to Kafka (Strimzi, KRaft) through the transactional outbox pattern, with at-least-once delivery and de-duplication by event ID in the consumer.
        tags: [kafka, architecture, messaging]
        status: done
      - id: nexora_infra
        text: Provisioned the VPC, EKS and RDS MySQL from versioned Terraform modules, with environment definitions on Terraform 1.10+ native S3 state locking.
        tags: [terraform, aws, eks, rds, vpc, networking]
        status: done
      - id: nexora_cicd
        text: Built secretless CI/CD in GitHub Actions that assumes AWS IAM roles through OIDC; every pull request tests, builds and Trivy-scans all six service images.
        tags: [github_actions, oidc, cicd, trivy, security]
        status: done
      - id: nexora_signing
        text: Released images tagged with the Git SHA to Amazon ECR and signed them by digest with Cosign.
        tags: [cosign, ecr, cicd, security]
        status: done
      - id: nexora_gitops
        text: Delivered through ArgoCD App-of-Apps GitOps, where a CI bot opens image-bump pull requests and Argo Rollouts releases the API gateway as a 10%, 50%, 100% canary that aborts if the Prometheus 5xx error rate exceeds 5%.
        tags: [argocd, gitops, argo_rollouts, prometheus, cicd, release]
        status: done
      - id: nexora_security
        text: Secured the platform with Istio mTLS, default-deny Kubernetes NetworkPolicies with per-service allow rules, and secrets generated in AWS Secrets Manager and projected by External Secrets Operator through IRSA; services run non-root with a read-only root filesystem.
        tags: [security, istio, networking, eso, irsa, kubernetes]
        status: done
      - id: nexora_observability
        text: Declared observability as code with 12 Prometheus alert rules each backed by a runbook, three Grafana dashboards, Fluent Bit shipping JSON logs with correlation IDs to Loki, and OpenTelemetry traces in Tempo.
        tags: [prometheus, alertmanager, grafana, loki, fluent_bit, tempo, opentelemetry, monitoring, observability]
        status: done
      - id: nexora_dr
        text: Ran a disaster-recovery drill that deleted the EKS cluster and rebuilt it to a healthy application in 23 minutes 50 seconds through Terraform and ArgoCD reconciliation, against a 30-minute RTO target.
        tags: [dr, reliability, terraform, argocd, eks]
        status: done
      - id: nexora_perf
        text: Load-tested two concurrency profiles, measuring about 420 ms median and 3,660 ms p99 on a single-account hotspot, and ruled out row-lock contention and CPU saturation as the bottleneck on disjoint accounts.
        tags: [performance, load_testing, mysql, troubleshooting]
        status: done
      - id: nexora_tests
        text: Wrote Pytest async integration and concurrency tests for the transfer path.
        tags: [python, pytest, testing]
        status: done
      - id: nexora_hpa
        text: Configured HPA autoscaling for the fraud service at a 50% CPU target, from 1 to 5 replicas.
        tags: [hpa, kubernetes, reliability]
        status: done
      - id: nexora_backstage
        text: Cataloged the services and their dependency graph in a Backstage developer portal.
        tags: [backstage, platform, developer_experience]
        status: done

