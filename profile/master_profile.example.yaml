# ---------------------------------------------------------------------------
# Cover-letter material per angle (PLAN.md 8.4). Paragraph 2 maps two job
# requirements to `evidence` ids; paragraph 3 uses `motivation`. Never use
# "I'm at the start of my career and want to learn" as the reason.
# ---------------------------------------------------------------------------
cover_letter:
  style:
    - 180-250 words, 3 paragraphs, plain and specific
    - each claim names the project, the technology and the result
    - no cliches ("I am writing to express my interest", "team player", "passionate about technology")
    - unknown company -> "Dear Hiring Team", never guess a name
  angles:
    devops:
      pitch: I build cloud platforms as code and prove they recover, from Terraform and EKS to GitOps delivery.
      evidence: [nexora_gitops, nexora_cicd, nexora_dr, ivg_oidc_fix, lab_infra, cicd_jenkins]
      motivation: >
        I like owning the path from a commit to a running, observable service, and making that path
        safe enough that a release can be rolled back by a metric instead of a person.
    support:
      pitch: I solve infrastructure problems methodically and document them so they stay solved.
      evidence: [story_oidc, story_ntp, lab_drills, lab_identity, story_systemd, nexora_tests]
      motivation: >
        Troubleshooting is the part of the work I already do every day: reading logs, narrowing a
        cause with evidence, fixing it, and writing the runbook. A support role puts that skill
        directly in front of users and production systems.
    monitoring:
      pitch: I instrument systems so problems are visible before users report them, and I test the alerts.
      evidence: [nexora_observability, nexora_gitops, ivg_ssa_fix, nexora_dr, lab_drills, cicd_jenkins]
      motivation: >
        I have built the alerting, dashboards and canary gates for my own platforms; monitoring is
        where I see the whole system at once, and where good signals turn incidents into short ones.
    networking:
      pitch: I combine network fundamentals from my engineering degree with hands-on cloud network design.
      evidence: [lab_vpn, lab_infra, lab_services, nexora_security, pt_design]
      motivation: >
        My degree and networking courses gave me the fundamentals; building VPNs, proxies and
        segmented VPCs on AWS showed me how much of reliability and security is decided in the network.
    systems:
      pitch: I run Linux fleets the way companies do, with central identity, hardening, patching and drills.
      evidence: [lab_identity, lab_compliance, lab_patching, lab_ansible, story_systemd, lab_drills]
      motivation: >
        I built and operate a company's Linux environment end to end and enjoy the operational side:
        patch cycles, access policy, compliance and recovering a host from a bad change.

