# config.yaml: only the settings this profile changes. Everything else comes from
# config/defaults.yaml (read it for every option and its meaning). Relative paths are
# inside this folder. Reference: docs/configuration.md.

timezone: Africa/Cairo

search:
  linkedin:
    titles: [Cloud Engineer, DevOps Engineer, IT Support Engineer, Technical Support Engineer]
    locations: [Egypt]

filters:
  countries: [Egypt]
  max_years_required: 2

ats:
  keep_locations: [Egypt, Alexandria, Cairo, Remote]

