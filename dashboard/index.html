<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Agent</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%230070f3'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EJA%3C/text%3E%3C/svg%3E">
<style>
  /* Look and feel from ahmeddhussain.github.io: monochrome, one confident blue gradient,
     glass surfaces, Space Grotesk / Inter / JetBrains Mono. Light mode swaps the tokens. */
  :root {
    --bg: #0a0a0a; --bg-2: #111111; --surface: rgb(23 23 23 / .72); --surface-solid: #161616;
    --border: rgb(255 255 255 / .09); --border-2: rgb(255 255 255 / .16);
    --text: #ededed; --muted: #a1a1a1; --muted-2: #6f6f6f;
    --a1: 50 145 255; --a2: 56 189 248; --a3: 245 166 35; --a4: 0 112 243;
    --c1: rgb(var(--a1)); --c2: rgb(var(--a2)); --c3: rgb(var(--a3)); --c4: rgb(var(--a4));
    --grad: linear-gradient(110deg, var(--c4), var(--c1) 45%, var(--c2));
    --good: #3ecf8e; --warn: #f5a623; --bad: #ff5c5c;
    --shadow: 0 30px 80px -30px rgb(0 0 0 / .7); --glow-op: .30; --radius: 16px;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --display: "Space Grotesk", "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --bg-2: #f2f2f2; --surface: rgb(255 255 255 / .82); --surface-solid: #ffffff;
    --border: rgb(0 0 0 / .09); --border-2: rgb(0 0 0 / .16);
    --text: #171717; --muted: #4d4d4d; --muted-2: #888888;
    --a1: 0 112 243; --a2: 2 132 199; --a3: 217 119 6; --a4: 0 87 200;
    --good: #0f9d58; --warn: #b26b00; --bad: #d33;
    --shadow: 0 30px 70px -35px rgb(0 0 0 / .25); --glow-op: .18; color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.55 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: background .3s, color .3s; overflow-x: hidden; }
  ::selection { background: rgb(var(--a1) / .3); }
  a { color: var(--c1); text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); }
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ambient glow, as on the portfolio */
  .glow { position: fixed; border-radius: 50%; filter: blur(90px); opacity: var(--glow-op); pointer-events: none; z-index: 0; animation: float 26s ease-in-out infinite; }
  .glow.g1 { width: 520px; height: 520px; background: rgb(var(--a4)); top: -200px; right: -120px; }
  .glow.g2 { width: 420px; height: 420px; background: rgb(var(--a2)); bottom: -220px; left: 10%; animation-delay: -12s; opacity: calc(var(--glow-op) * .6); }
  @keyframes float { 50% { transform: translate(-40px, 30px) scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .glow, .pulse { animation: none !important; } * { transition: none !important; } }

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  nav.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 12px; border-right: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(16px) saturate(1.3); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 2px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; color: #fff; font: 700 14px var(--display); box-shadow: 0 6px 20px -6px rgb(var(--a1) / .7); }
  .brand b { font: 700 16px var(--display); letter-spacing: -.01em; }
  .nav-sub { color: var(--muted-2); font-size: 12px; margin: 4px 10px 16px; display: flex; align-items: center; gap: 6px; }
  .navgroup { font: 500 10.5px var(--mono); color: var(--muted-2); text-transform: uppercase; letter-spacing: .1em; margin: 14px 10px 6px; }
  nav.side a.tab { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 10px; color: var(--muted); margin-bottom: 1px; transition: background .15s, color .15s; }
  nav.side a.tab:hover { background: rgb(var(--a1) / .07); color: var(--text); }
  nav.side a.tab.active { background: rgb(var(--a1) / .13); color: var(--text); box-shadow: inset 2px 0 0 var(--c1); }
  .count { font: 500 11px var(--mono); min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 999px; background: rgb(255 255 255 / .06); color: var(--muted); }
  :root[data-theme="light"] .count { background: rgb(0 0 0 / .06); }
  .count:empty { display: none; }
  .count.hot { background: var(--c3); color: #1a1000; font-weight: 700; }
  .side-foot { margin: 18px 10px 0; display: flex; gap: 6px; flex-wrap: wrap; }

  main { padding: 18px clamp(14px, 3vw, 40px) 80px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .topbar .grow { flex: 1; }
  .page-h { margin: 6px 0 18px; }
  .page-h h2 { margin: 0; font: 700 clamp(24px, 3vw, 32px)/1.1 var(--display); letter-spacing: -.02em; }
  .page-h .hint { color: var(--muted); margin-top: 6px; }
  .banner { border: 1px solid rgb(var(--a3) / .4); background: rgb(var(--a3) / .1); color: var(--c3); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; display: none; }
  .banner.show { display: block; }

  .glass, .tile, .card, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(12px); }
  .grid { display: grid; gap: 14px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-bottom: 14px; }
  .tile { padding: 15px 16px; transition: transform .15s, border-color .15s; }
  .tile.link { cursor: pointer; } .tile.link:hover { transform: translateY(-2px); border-color: rgb(var(--a1) / .45); }
  .tile .label { color: var(--muted); font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; }
  .tile .value { font: 700 30px/1.15 var(--display); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .hint { color: var(--muted-2); font-size: 12px; }
  .panel { padding: 16px 18px; margin-bottom: 14px; }
  .panel h3 { margin: 0 0 4px; font: 600 16px var(--display); }
  .panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .two { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }

  .callout { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--radius); margin-bottom: 14px; flex-wrap: wrap; border: 1px solid rgb(var(--a1) / .35); background: linear-gradient(110deg, rgb(var(--a4) / .16), rgb(var(--a2) / .08)); }
  .callout b { font: 600 16px var(--display); }
  .callout .grow { flex: 1; }
  .callout.amber { border-color: rgb(var(--a3) / .4); background: rgb(var(--a3) / .08); }

  .btn { border: 1px solid var(--border-2); background: transparent; padding: 6px 13px; border-radius: 10px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; color: var(--text); }
  .btn:hover { border-color: var(--c1); background: rgb(var(--a1) / .08); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--grad); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 8px 24px -10px rgb(var(--a1) / .8); }
  .btn.solid { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .btn.good { border-color: rgb(62 207 142 / .5); color: var(--good); }
  .btn.danger { border-color: rgb(255 92 92 / .45); color: var(--bad); }
  .btn.small { padding: 3px 10px; font-size: 12px; border-radius: 8px; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card { padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--border-2); }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .title[data-open] { cursor: pointer; font: 600 15px/1.3 var(--display); }
  .title[data-open]:hover { color: var(--c1); }
  .muted { color: var(--muted); font-size: 12.5px; }
  .faint { color: var(--muted-2); font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); margin: 0 4px 4px 0; }
  .chip.good { color: var(--good); border-color: rgb(62 207 142 / .35); }
  .chip.warn { color: var(--c3); border-color: rgb(var(--a3) / .4); }
  .chip.bad { color: var(--bad); border-color: rgb(255 92 92 / .35); }
  .chip.accent { color: var(--c1); border-color: rgb(var(--a1) / .4); }
  .chip .x { cursor: pointer; opacity: .6; margin-left: 2px; } .chip .x:hover { opacity: 1; }
  .reason { background: rgb(var(--a1) / .05); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; color: var(--muted); }
  .fit { display: inline-flex; align-items: center; gap: 7px; font: 500 12.5px var(--mono); }
  .fitbar { width: 52px; height: 5px; border-radius: 3px; background: rgb(255 255 255 / .08); overflow: hidden; }
  :root[data-theme="light"] .fitbar { background: rgb(0 0 0 / .08); }
  .fitbar i { display: block; height: 100%; background: var(--grad); }
  .prio { font: 700 10.5px var(--mono); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border-2); color: var(--muted); }
  .prio.p1 { background: var(--grad); color: #fff; border-color: transparent; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .pulse { animation: pulse 1.6s infinite; } @keyframes pulse { 50% { opacity: .35; } }

  .section-title { display: flex; align-items: center; gap: 10px; margin: 26px 0 6px; }
  .section-title h3 { margin: 0; font: 600 17px var(--display); }
  .section-hint { color: var(--muted-2); font-size: 12.5px; margin-bottom: 12px; }
  .empty { color: var(--muted-2); padding: 20px; text-align: center; border: 1px dashed var(--border-2); border-radius: var(--radius); }

  .board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; min-height: 240px; background: rgb(255 255 255 / .02); }
  .col h4 { margin: 2px 4px 10px; font: 600 13px var(--display); display: flex; justify-content: space-between; }
  .col.drop { border-color: var(--c1); background: rgb(var(--a1) / .06); }
  .mini { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; padding: 10px 11px; margin-bottom: 8px; cursor: grab; transition: transform .12s; }
  .mini:hover { transform: translateY(-1px); border-color: var(--border-2); }

  details.group { margin-bottom: 10px; }
  details.group > summary { padding: 12px 16px; cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary .what { flex: 1; color: var(--muted); font-size: 12.5px; }
  .li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--border); align-items: center; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  input[type=search], input[type=text], input[type=number], select, textarea { background: var(--surface-solid); border: 1px solid var(--border-2); border-radius: 10px; padding: 7px 11px; font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--c1); box-shadow: 0 0 0 3px rgb(var(--a1) / .18); }
  input[type=search] { min-width: 280px; }
  input[type=checkbox] { accent-color: rgb(var(--a1)); width: 15px; height: 15px; }
  textarea { width: 100%; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th[data-sort] { cursor: pointer; } th[data-sort]:hover { color: var(--text); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.r td { transition: background .12s; } tr.r:hover td { background: rgb(var(--a1) / .05); }
  tr.r .rowtitle { cursor: pointer; }

  .bulkbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(120px); transition: transform .2s; z-index: 15; display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 14px; background: var(--surface-solid); border: 1px solid var(--border-2); box-shadow: var(--shadow); }
  .bulkbar.show { transform: translateX(-50%); }

  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 10; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  aside.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(700px, 100vw); background: var(--surface-solid); border-left: 1px solid var(--border); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); z-index: 11; overflow-y: auto; padding: 22px 24px 60px; }
  aside.drawer.open { transform: none; }
  .drawer h2 { margin: 0 0 4px; font: 700 22px/1.2 var(--display); letter-spacing: -.01em; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 5px 14px; font-size: 13px; margin: 12px 0; }
  .kv .k { color: var(--muted-2); font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
  .drawer h4 { margin: 22px 0 8px; font: 500 11px var(--mono); color: var(--muted-2); text-transform: uppercase; letter-spacing: .1em; }
  pre.post, pre.log { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: rgb(255 255 255 / .03); border: 1px solid var(--border); padding: 12px; border-radius: 12px; max-height: 340px; overflow: auto; margin: 0; }
  :root[data-theme="light"] pre.post, :root[data-theme="light"] pre.log { background: rgb(0 0 0 / .03); }
  iframe.cv { width: 100%; height: 760px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
  .menu { position: relative; display: inline-block; }
  .menu .items { position: absolute; z-index: 20; top: calc(100% + 4px); right: 0; min-width: 200px; background: var(--surface-solid); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: none; }
  .menu.open .items { display: block; }
  .menu .items button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .menu .items button:hover { background: rgb(var(--a1) / .1); }

  .answers .a { display: grid; grid-template-columns: 230px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .answers .a:last-child { border-bottom: 0; }
  .q { display: grid; grid-template-columns: 1fr minmax(200px, 340px) auto; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .setrow { display: grid; grid-template-columns: 220px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: start; }
  .setrow:last-child { border-bottom: 0; }
  .setrow .lbl b { display: block; font-weight: 600; }
  .chipedit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chipedit input { min-width: 180px; }
  .switch { position: relative; width: 38px; height: 22px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--border-2); transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--c1); }
  .switch input:checked + span::after { transform: translateX(16px); }

  .toast { position: fixed; bottom: 22px; right: 22px; transform: translateY(30px); background: var(--surface-solid); border: 1px solid var(--border-2); color: var(--text); padding: 10px 16px; border-radius: 12px; opacity: 0; transition: all .2s; z-index: 30; font-size: 13px; box-shadow: var(--shadow); pointer-events: none; max-width: 420px; }
  .toast.show { opacity: 1; transform: none; }
  .chart { height: 150px; } .chart svg { width: 100%; height: 100%; display: block; }
  .funnel .step { display: grid; grid-template-columns: 110px 1fr 46px; gap: 10px; align-items: center; margin: 7px 0; font-size: 13px; }
  .funnel .bar { height: 8px; border-radius: 4px; background: var(--grad); min-width: 2px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .num { text-align: right; font: 500 12.5px var(--mono); }
  .runpanel { margin-bottom: 14px; }
  .runpanel pre.log { max-height: 260px; }
  .bar-h { height: 6px; border-radius: 3px; background: var(--grad); }
  .fade { animation: fade .25s ease; } @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  @media (max-width: 880px) {
    .app { grid-template-columns: 1fr; }
    nav.side { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--border); }
    .navgroup, .nav-sub, .side-foot { display: none; }
    .board { grid-template-columns: repeat(4, 250px); }
    .answers .a, .q, .setrow { grid-template-columns: 1fr; }
    input[type=search] { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="app">
  <nav class="side" id="nav">
    <div class="brand"><div class="logo">JA</div><b>Job Agent</b></div>
    <div class="nav-sub" id="nav-sub">loading…</div>
    <div class="navgroup">Work</div>
    <a class="tab" href="#today" data-tab="today">Today <span class="count" id="c-today"></span></a>
    <a class="tab" href="#action" data-tab="action">Needs action <span class="count" id="c-action"></span></a>
    <a class="tab" href="#applied" data-tab="applied">Applied <span class="count" id="c-applied"></span></a>
    <a class="tab" href="#skipped" data-tab="skipped">Skipped <span class="count" id="c-skipped"></span></a>
    <a class="tab" href="#all" data-tab="all">All jobs <span class="count" id="c-all"></span></a>
    <div class="navgroup">Insight</div>
    <a class="tab" href="#sources" data-tab="sources">Sources <span class="count" id="c-sources"></span></a>
    <a class="tab" href="#companies" data-tab="companies">Companies <span class="count" id="c-companies"></span></a>
    <a class="tab" href="#runs" data-tab="runs">Runs <span class="count" id="c-runs"></span></a>
    <div class="navgroup">You</div>
    <a class="tab" href="#profile" data-tab="profile">Profile <span class="count" id="c-profile"></span></a>
    <a class="tab" href="#settings" data-tab="settings">Settings <span class="count" id="c-settings"></span></a>
    <div class="side-foot">
      <button class="btn small" id="refresh" type="button">Refresh</button>
      <button class="btn small" id="theme" type="button">Theme</button>
    </div>
  </nav>
  <main>
    <div class="topbar">
      <div class="grow faint mono" id="clock"></div>
      <span class="faint" id="runstate"></span>
      <div class="menu" id="runmenu">
        <button class="btn primary" id="runbtn" type="button">▶ Run now</button>
        <div class="items"><button type="button" data-run="live">Run now (live)</button><button type="button" data-run="dry">Dry run (nothing sent or submitted)</button></div>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <div id="runpanel"></div>
    <section id="view" class="fade"></section>
  </main>
</div>
<div class="bulkbar" id="bulkbar"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Job details"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Job posts are untrusted: only http(s) links are ever rendered as links.
  const safeUrl = (u) => { if (!u) return null; try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
  const link = (u, label, cls = "btn small") => { const s = safeUrl(u); return s ? `<a class="${cls}" href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : ""; };

  const STATUS = {
    new: { label: "Queued for next run", color: "var(--muted-2)" },

    applied: { label: "Applied", color: "var(--c2)" },
    interview: { label: "Interview", color: "var(--good)" },
    offer: { label: "Offer", color: "var(--good)" },

  const SKIP = {

    over_experience: ["Too many years", "The post asks for more years than your limit."],
    excluded_title: ["Excluded title", "Titles you excluded (Settings)."],
    blocked_company: ["Blocked company", "Companies you never apply to (Settings)."],
    location: ["Location", "Outside the countries you accept and not remote."],

  const REASONS = { wrong_field: "Wrong field", too_senior: "Too senior", company: "The company", location: "Location", already_applied: "Already applied myself", other: "Other" };
  const SOURCE = { whatsapp: "WhatsApp group", whatsapp_channel: "WhatsApp channel", whatsapp_export: "WhatsApp", alert_email: "Job alert", linkedin: "LinkedIn search", ats: "Company board", html: "Careers page", manual: "Added by hand" };

  const state = { jobs: [], dup: [], stats: null, profile: null, runs: [], settings: null, editable: false, sugg: [], sources: [], follow: [], run: null,
    tab: "today", q: "", status: "", source: "", sort: { k: "posted", d: -1 }, showDup: false, open: null, sel: new Set(), cv: false };

  // ---------------------------------------------------------------- helpers
  const rel = (iso) => {
    if (!iso) return "—";
    const m = (Date.now() - new Date(iso)) / 60000;
    if (m < 1) return "just now";
    if (m < 60) return `${Math.round(m)}m ago`;
    if (m < 1440) return `${Math.round(m / 60)}h ago`;
    const d = Math.round(m / 1440);
    return d < 45 ? `${d}d ago` : `${Math.round(d / 30)} months ago`;
  };
  const postedOf = (j) => j.job_posted_at || j.posted_at;
  const fit = (j) => j.fit_score == null ? `<span class="faint">no score</span>` : `<span class="fit"><span class="fitbar"><i style="width:${Math.max(0, Math.min(100, j.fit_score))}%"></i></span>${j.fit_score}</span>`;
  const prio = (j) => j.priority ? `<span class="prio ${j.priority === 1 ? "p1" : ""}">P${j.priority}</span>` : "";
  const company = (j) => esc(j.company || "Company not named");
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200); };
  const by = (s) => state.jobs.filter((j) => j.status === s);
  const isManual = (j) => j.status === "ready" && (j.app_mode === "manual" || j.app_mode === "package");
  const isDraft = (j) => j.status === "ready" && j.apply_channel === "email";
  const appliedSet = () => state.jobs.filter((j) => ["applied", "interview", "offer", "rejected"].includes(j.status));
  const norm = (c) => String(c || "").toLowerCase().replace(/\b(inc|llc|ltd|co|corp|company|group|s\.?a\.?e|plc|gmbh)\b\.?/g, " ").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  const inList = (c, list) => !!c && (list || []).some((x) => norm(x) === norm(c));
  const skipKey = (j) => (j.skip_reason || "other").startsWith("discarded") ? "discarded" : (j.skip_reason || "other");

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    return body;
  }

  async function load() {
    try {
      const [j, d, s, p, r, st, sg, so, fu, run] = await Promise.all([
        api("/api/jobs"), api("/api/jobs?include_duplicates=true&status=skipped"), api("/api/stats"), api("/api/profile"), api("/api/runs"),
        api("/api/settings"), api("/api/suggestions"), api("/api/sources"), api("/api/followups"), api("/api/run"),
      ]);
      Object.assign(state, { jobs: j.jobs, dup: d.jobs.filter((x) => x.skip_reason === "duplicate"), stats: s, profile: p, runs: r.runs, settings: st.settings, editable: st.editable, sugg: sg.suggestions, sources: so.sources, follow: fu.due, run });
      $("banner").classList.remove("show");
    } catch (e) {
      $("banner").textContent = `The agent's API isn't reachable (${e.message}). Start it with ./agent.sh dashboard.`;
      $("banner").classList.add("show");
    }
    render();
  }

  async function patch(id, body, msg) {
    try {
      const r = await api(`/api/jobs/${id}`, { method: "PATCH", body: JSON.stringify(body) });
      const j = state.jobs.find((x) => x.id === id) || state.dup.find((x) => x.id === id);
      if (j) Object.assign(j, body);
      toast(r.note || msg || "Saved");
      render(); if (state.open === id) openDrawer(id);
    } catch (e) { toast(`Not saved: ${e.message}`); }
  }
  async function post(path, body, msg) {
    try { const r = await api(path, { method: path.includes("/settings") ? "PUT" : "POST", body: JSON.stringify(body || {}) }); if (msg) toast(typeof msg === "function" ? msg(r) : msg); return r; }
    catch (e) { toast(`Failed: ${e.message}`); return null; }
  }

  // ---------------------------------------------------------------- nav + counts
  function counts() {
    const qs = state.profile?.questions?.length || 0;
    const action = state.jobs.filter((j) => isManual(j) || isDraft(j) || j.status === "needs_review").length + qs + state.follow.length;
    const set = (id, n, hot) => { const el = $(id); el.textContent = n ? n : ""; el.classList.toggle("hot", !!hot && n > 0); };
    set("c-action", action, true);
    set("c-applied", appliedSet().length);
    set("c-skipped", by("skipped").length);
    set("c-all", state.jobs.length);
    set("c-profile", qs, true);
    set("c-settings", state.sugg.length, true);
    set("c-companies", state.stats?.companies?.length || 0);
    set("c-runs", state.runs.length);
    set("c-sources", state.sources.length);
    const r = state.stats?.last_run;
    const col = r ? (r.status === "success" ? "var(--good)" : r.status === "partial" ? "var(--c3)" : "var(--bad)") : "var(--muted-2)";
    $("nav-sub").innerHTML = `<span class="dot" style="background:${col}"></span>${r ? `last run ${esc(rel(r.finished_at || r.started_at))}` : "no runs yet"}`;
    document.querySelectorAll("a.tab").forEach((a) => a.classList.toggle("active", a.dataset.tab === state.tab));
  }

  function render() {
    counts(); renderRun();
    const v = { today, action, applied, skipped, all, sources, profile, settings, companies, runs }[state.tab] || today;
    $("view").innerHTML = v();
    $("view").classList.remove("fade"); void $("view").offsetWidth; $("view").classList.add("fade");
    if (state.tab === "today") drawChart();
    renderBulk();
  }

  // ---------------------------------------------------------------- run now
  let runPoll = null, notified = true;
  function renderRun() {
    const r = state.run;
    $("runstate").innerHTML = r?.running ? `<span class="dot pulse" style="background:var(--c1)"></span>${r.dry_run ? "dry run" : "run"} in progress · ${esc(rel(r.started_at))}` : "";
    $("runbtn").disabled = !!r?.running;
    if (!r || (!r.running && !r.lines?.length) || r.unavailable) { $("runpanel").innerHTML = ""; return; }
    const ok = r.exit_code === 0;
    $("runpanel").innerHTML = `<div class="panel runpanel"><div class="row-actions" style="justify-content:space-between"><h3>${r.running ? `<span class="dot pulse" style="background:var(--c1)"></span>Running${r.dry_run ? " (dry run)" : ""}` : ok ? "Run finished" : `Run ended with code ${esc(r.exit_code)}`}</h3>${r.running ? "" : `<button class="btn small" id="closerun">Hide</button>`}</div>
      <pre class="log" id="runlog">${esc((r.lines || []).slice(-200).join("\n"))}</pre></div>`;
    const lg = $("runlog"); if (lg) lg.scrollTop = lg.scrollHeight;
  }
  async function pollRun() {
    try {
      state.run = await api("/api/run");
      if (state.run.running) { notified = false; renderRun(); return; }
      clearInterval(runPoll); runPoll = null;
      if (!notified) {
        notified = true;
        const msg = state.run.exit_code === 0 ? "The run finished. Your dashboard is up to date." : `The run ended with code ${state.run.exit_code}.`;
        toast(msg);
        try { if ("Notification" in window && Notification.permission === "granted") new Notification("Job Agent", { body: msg }); } catch (_) {}
        await load();
      }
    } catch (_) {}
  }
  async function startRun(dry) {
    try { if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); } catch (_) {}
    const r = await post("/api/run", { dry_run: dry }, dry ? "Dry run started" : "Run started");
    if (!r) return;
    state.run = r; notified = false; renderRun();
    runPoll = setInterval(pollRun, 2000);
  }

  // ---------------------------------------------------------------- Today
  function today() {
    const J = state.jobs, s = state.stats || {}, r = s.last_run, stats = r?.stats || {};
    const manual = J.filter(isManual), drafts = J.filter(isDraft), review = by("needs_review"), qs = state.profile?.questions || [];
    const todo = manual.length + drafts.length + review.length + qs.length + state.follow.length;
    const week = appliedSet().filter((j) => (Date.now() - new Date(j.applied_at || j.posted_at)) / 864e5 <= 7).length;
    const replies = appliedSet().filter((j) => j.has_reply || ["interview", "offer"].includes(j.status)).length;
    const fresh = J.filter((j) => j.status !== "skipped" && (Date.now() - new Date(postedOf(j))) / 36e5 <= 24).length;
    const tiles = [
      ["Need you", todo, "drafts · forms · questions", "action"],
      ["Drafts to send", drafts.length, "review in Gmail", "action"],
      ["Apply yourself", manual.length, "pre-filled, one click", "action"],
      ["Applied · 7 days", week, `${appliedSet().length} all time`, "applied"],
      ["Interviews", J.filter((j) => ["interview", "offer"].includes(j.status)).length, "incl. offers", "applied"],
      ["Response rate", appliedSet().length ? Math.round(replies / appliedSet().length * 100) + "%" : "—", `${replies} replied`, "applied"],
      ["New · 24 h", fresh, "matches", "all"],
    ];
    const sources = (stats.sources || []).map((x) => `<span class="chip ${x.ok ? "good" : "bad"}">${esc(x.name)} · ${x.ok ? esc(String(x.inserted)) + " new" : "failed"}</span>`).join("");
    const steps = [["Jobs seen", J.length + state.dup.length], ["Unique", J.length], ["Matched", J.filter((j) => j.status !== "skipped").length], ["Prepared", J.filter((j) => ["ready", "applied", "interview", "offer", "rejected"].includes(j.status)).length], ["Applied", appliedSet().length], ["Interview+", J.filter((j) => ["interview", "offer"].includes(j.status)).length]];
    const max = Math.max(1, steps[0][1]);
    const parts = [qs.length && `${qs.length} question${qs.length > 1 ? "s" : ""} to answer`, drafts.length && `${drafts.length} drafts to send`, manual.length && `${manual.length} to apply yourself`, review.length && `${review.length} to review`, state.follow.length && `${state.follow.length} follow-up${state.follow.length > 1 ? "s" : ""} due`].filter(Boolean).join(" · ");
    const hour = new Date().getHours();
    return `
      <div class="page-h"><h2>Good ${hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening"}, <span class="grad">${esc((state.profile?.candidate?.full_name || "").split(" ")[0] || "there")}</span>.</h2><div class="hint">${esc(new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }))}</div></div>
      ${todo ? `<div class="callout"><span class="grow"><b>${todo} ${todo === 1 ? "thing needs" : "things need"} you.</b><br><span class="muted">${esc(parts)}</span></span><a class="btn primary" href="#action">Open Needs action →</a></div>` : `<div class="callout"><span class="grow"><b>You're all caught up.</b><br><span class="muted">Run the agent for fresh jobs.</span></span></div>`}
      ${state.sugg.length ? `<div class="callout amber"><span class="grow"><b>${state.sugg.length} rule${state.sugg.length > 1 ? "s" : ""} learned from your "Not a fit" choices.</b><br><span class="muted">Apply them so the agent stops bringing those jobs.</span></span><a class="btn" href="#settings">Review in Settings →</a></div>` : ""}
      <div class="grid tiles">${tiles.map(([l, v, h, t]) => `<div class="tile link" data-go="${t}"><div class="label">${l}</div><div class="value">${esc(v)}</div><div class="hint">${h}</div></div>`).join("")}</div>
      <div class="grid two">
        <div class="panel"><h3>Last run</h3>
          ${r ? `<div class="sub"><span class="chip ${r.status === "success" ? "good" : r.status === "partial" ? "warn" : "bad"}">${esc(r.status)}</span> ${esc(rel(r.finished_at || r.started_at))}${r.finished_at ? ` · took ${Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 60000)} min` : ""}</div>
          <div>${sources}</div>
          <div class="muted" style="margin-top:8px">${stats.items ? `${stats.items.processed} items read · ${stats.items.left} left` : ""}${stats.llm ? ` · ${stats.llm.calls} model calls (${stats.llm.failed} failed)` : ""}${stats.companies_discovered ? ` · ${stats.companies_discovered} companies discovered` : ""}</div>
          ${r.error ? `<div class="reason" style="margin-top:8px">${esc(r.error)}</div>` : ""}` : `<div class="empty">No run yet. Press ▶ Run now.</div>`}
        </div>
        <div class="panel"><h3>Funnel</h3><div class="sub">From every job seen to interviews</div><div class="funnel">${steps.map(([k, n]) => `<div class="step"><span>${k}</span><span class="bar" style="width:${n / max * 100}%"></span><span class="num">${n}</span></div>`).join("")}</div></div>
      </div>
      <div class="panel"><h3>Applications per day</h3><div class="sub">Last 14 days</div><div class="chart" id="chart"></div></div>`;
  }
  function drawChart() {
    const el = $("chart"); if (!el) return;
    const data = state.stats?.applied_per_day || [];
    if (!data.some((d) => d.count)) { el.innerHTML = `<div class="empty">No applications yet.</div>`; return; }
    const W = el.clientWidth || 700, H = 150, pl = 26, pb = 20, pt = 6, max = Math.max(4, ...data.map((d) => d.count));
    const step = Math.ceil(max / 4), top = step * 4, slot = (W - pl) / data.length, bw = Math.min(26, slot * .6), y = (v) => pt + (H - pb - pt) * (1 - v / top);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications per day"><defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="rgb(56 189 248)"/><stop offset="1" stop-color="rgb(0 112 243)"/></linearGradient></defs>`;
    for (let v = 0; v <= top; v += step) s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted-2)" font-family="JetBrains Mono">${v}</text>`;
    data.forEach((d, i) => { const x = pl + slot * i + slot / 2;
      if (d.count) s += `<rect x="${x - bw / 2}" y="${y(d.count)}" width="${bw}" height="${y(0) - y(d.count)}" rx="4" fill="url(#gb)"><title>${esc(d.date)}: ${d.count}</title></rect>`;
      if (i % 2 === 0) s += `<text x="${x}" y="${H - 5}" text-anchor="middle" font-size="10" fill="var(--muted-2)" font-family="JetBrains Mono">${esc(d.date.slice(5))}</text>`; });
    el.innerHTML = s + "</svg>";
  }

  // ---------------------------------------------------------------- shared pieces
  const docs = (j) => `${j.files?.cv ? link(j.files.cv, "CV") : ""}${j.files?.cover ? link(j.files.cover, "Letter") : ""}${j.files?.form ? link(j.files.form, "Filled form") : ""}`;
  const notFit = (id) => `<span class="menu" data-menu><button class="btn small danger" type="button" data-menu-open>Not a fit ▾</button><span class="items">${Object.entries(REASONS).map(([k, v]) => `<button type="button" data-discard="${id}:${k}">${esc(v)}</button>`).join("")}</span></span>`;
  const check = (j) => `<input type="checkbox" data-sel="${j.id}" ${state.sel.has(j.id) ? "checked" : ""} aria-label="Select ${esc(j.title)}">`;
  function jobCard(j, body, actions) {
    return `<div class="card">
      <div class="top"><div style="display:flex;gap:10px">${check(j)}<div><div class="title" data-open="${j.id}">${esc(j.title)}</div><div class="muted">${company(j)}${j.location ? " · " + esc(j.location) : ""} · ${esc(rel(postedOf(j)))}${inList(j.company, state.settings?.favorite_companies) ? ` <span class="chip warn">★ favorite</span>` : ""}</div></div></div><div style="text-align:right">${prio(j)}<div style="margin-top:4px">${fit(j)}</div></div></div>
      ${body}<div class="row-actions">${actions}</div></div>`;
  }
  const questionRows = (qs) => qs.map((q) => `<div class="q"><div><b>${esc(q.question)}</b><div class="faint">asked ${q.times}× · saved as <span class="mono">${esc(q.suggested_key)}</span></div></div><input type="text" data-qinput="${q.id}" placeholder="Your answer" aria-label="Answer"><button class="btn primary small" data-answer="${q.id}" data-key="${esc(q.suggested_key)}">Save</button></div>`).join("");
  const sec = (title, hint, list, card, cmd) => `<div class="section-title"><h3>${title}</h3><span class="count">${list.length || ""}</span>${cmd ? `<span class="faint mono">${cmd}</span>` : ""}</div><div class="section-hint">${hint}</div>${list.length ? `<div class="cards">${list.map(card).join("")}</div>` : `<div class="empty">Nothing here.</div>`}`;

  // ---------------------------------------------------------------- Needs action
  function action() {
    const qs = state.profile?.questions || [];
    const drafts = state.jobs.filter(isDraft), manual = state.jobs.filter(isManual), review = by("needs_review"), queued = by("new");
    const fol = state.follow;
    return `<div class="page-h"><h2>Needs action</h2><div class="hint">Everything that waits for you, in the order to do it.</div></div>
      ${qs.length ? `<div class="panel"><h3>Questions forms asked that your profile doesn't answer</h3><div class="sub">Answer once: saved to your profile, and the waiting forms are retried on the next run.</div>${questionRows(qs)}</div>` : ""}
      ${sec("Email drafts to send", "Read them in Gmail Drafts; edit or delete any; then send all at once.", drafts, (j) => jobCard(j, `<div class="reason">To ${esc(j.apply_email)}</div>`, `${link(j.gmail_draft_url, "Open draft", "btn small primary")}${docs(j)}<button class="btn small good" data-status="${j.id}:applied">Mark sent</button>${notFit(j.id)}`), "./agent.sh send")}
      ${sec("Apply yourself", "Prepared but not submitted: a captcha, a sign-in, Easy Apply or an open question.", manual, (j) => jobCard(j, `<div class="reason">${esc(j.manual_reason || "apply on the site")}</div>`, `${link(j.apply_url_direct || j.apply_url, j.apply_url_direct ? "Company form" : "Open", "btn small primary")}${docs(j)}<button class="btn small good" data-status="${j.id}:applied">Mark applied</button>${notFit(j.id)}`), "./agent.sh apply")}
      ${fol.length ? `<div class="section-title"><h3>Follow-ups due</h3><span class="count">${fol.length}</span></div><div class="section-hint">Email applications with no reply after ${esc(state.settings ? "" : "")}${fol[0] ? "" : ""}a week. The agent drafts a short follow-up in the same thread; you send it.</div>
        <div class="cards">${fol.map((f) => `<div class="card"><div class="top"><div><div class="title" data-open="${f.job_id}">${esc(f.title)}</div><div class="muted">${esc(f.company || "")} · sent ${f.days} days ago to ${esc(f.to)}</div></div></div><div class="row-actions"><button class="btn small primary" data-follow="${f.job_id}">Draft follow-up</button><button class="btn small" data-status="${f.job_id}:rejected">Mark rejected</button></div></div>`).join("")}</div>` : ""}
      ${sec("Needs review", "The agent stopped before preparing these: an eligibility condition, signs of a scam, or no way to apply.", review, (j) => jobCard(j, `<div class="reason">${esc(j.skip_reason || "check")}${(j.flags || []).length ? " · " + j.flags.map(esc).join(", ") : ""}</div>`, `<button class="btn small primary" data-status="${j.id}:new">Prepare anyway</button>${link(j.apply_url, "Listing")}${notFit(j.id)}`))}
      ${queued.length ? sec("Queued for the next run", "Prepared by the next run (or ▶ Run now).", queued, (j) => jobCard(j, `<div class="faint">job ${j.id}</div>`, `<button class="btn small" data-status="${j.id}:skipped">Unqueue</button>`)) : ""}`;
  }

  // ---------------------------------------------------------------- Applied board
  function applied() {
    const cols = [["applied", "Applied"], ["interview", "Interview"], ["offer", "Offer"], ["rejected", "Rejected"]];
    const card = (j) => `<div class="mini" draggable="true" data-drag="${j.id}"><div class="title" data-open="${j.id}" style="font-size:13.5px">${esc(j.title)}</div><div class="faint">${company(j)}</div>
      <div class="faint" style="margin-top:4px">${j.has_reply ? `<span class="chip good">● reply</span>` : ""}${esc(j.app_mode === "submitted" ? "form submitted" : j.apply_channel === "email" ? "email" : "applied")} · ${esc(rel(j.applied_at || j.posted_at))}</div></div>`;
    return `<div class="page-h"><h2>Applied</h2><div class="hint">Drag a card when a company answers. Replies to your emails are detected on every run.</div></div>
      <div class="board">${cols.map(([k, l]) => { const list = by(k); return `<div class="col" data-col="${k}"><h4>${l}<span class="count">${list.length || ""}</span></h4>${list.map(card).join("") || `<div class="faint" style="padding:6px">Drop cards here</div>`}</div>`; }).join("")}</div>`;
  }

  // ---------------------------------------------------------------- Skipped
  function skipped() {
    const list = by("skipped").concat(state.showDup ? state.dup : []);
    const groups = {};
    for (const j of list) (groups[skipKey(j)] ||= []).push(j);
    const order = Object.keys(SKIP).filter((k) => groups[k]).concat(Object.keys(groups).filter((k) => !SKIP[k]));
    return `<div class="page-h"><h2>Skipped</h2><div class="hint">What the agent didn't apply to, and why. Rescue anything it missed: "Prepare anyway" queues it for the next run.</div></div>
      <div class="filters"><label class="faint"><input type="checkbox" id="showdup" ${state.showDup ? "checked" : ""}> show duplicates (${state.dup.length})</label></div>
      ${order.length ? order.map((k) => `<details class="group glass" ${k === "low_fit" ? "open" : ""}><summary><b style="font-family:var(--display)">${esc((SKIP[k] || [k])[0])}</b><span class="count">${groups[k].length}</span><span class="what">${esc((SKIP[k] || ["", ""])[1])}</span></summary>
        ${groups[k].sort((a, b) => (b.fit_score ?? -1) - (a.fit_score ?? -1)).map((j) => `<div class="li">${check(j)}<div><span class="title" data-open="${j.id}" style="font-size:14px">${esc(j.title)}</span> <span class="muted">${company(j)}</span><div class="faint">${fit(j)} · posted ${esc(rel(postedOf(j)))} · ${esc(SOURCE[j.source] || j.source)}${j.discard_reason ? ` · ${esc(REASONS[j.discard_reason] || j.discard_reason)}` : ""}</div></div>
          <div class="row-actions">${link(j.apply_url_direct || j.apply_url, "Listing")}${j.skip_reason !== "duplicate" ? `<button class="btn small primary" data-status="${j.id}:new">Prepare anyway</button>` : ""}</div></div>`).join("")}</details>`).join("") : `<div class="empty">Nothing skipped.</div>`}`;
  }

  // ---------------------------------------------------------------- All jobs
  function all() {
    const q = state.q.toLowerCase();
    const rows = state.jobs.filter((j) => (!state.status || j.status === state.status) && (!state.source || j.source === state.source)
      && (!q || [j.title, j.company, j.location, j.apply_email, j.source_name, j.notes].join(" ").toLowerCase().includes(q)));
    const key = { posted: (j) => postedOf(j) || "", fit: (j) => j.fit_score ?? -1, title: (j) => j.title.toLowerCase(), status: (j) => j.status, prio: (j) => j.priority ?? 9 }[state.sort.k];
    rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * state.sort.d);
    const opt = (v, l, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`;
    const arrow = (k) => state.sort.k === k ? (state.sort.d > 0 ? " ↑" : " ↓") : "";
    return `<div class="page-h"><h2>All jobs</h2><div class="hint">${rows.length} shown · press <span class="mono">/</span> to search · tick rows for bulk actions</div></div>
      <div class="filters">
        <input type="search" id="q" placeholder="Search title, company, email, notes…" value="${esc(state.q)}">
        <select id="fstatus">${opt("", "Any status", state.status)}${Object.entries(STATUS).map(([k, v]) => opt(k, v.label, state.status)).join("")}</select>
        <select id="fsource">${opt("", "Any source", state.source)}${Object.entries(SOURCE).filter(([k]) => k !== "whatsapp_export").map(([k, v]) => opt(k, v, state.source)).join("")}</select>
        <button class="btn small" id="selall" type="button">Select shown</button>
      </div>
      <div class="glass" style="overflow-x:auto;border-radius:var(--radius)"><table><thead><tr><th></th>
        <th data-sort="prio">Pri${arrow("prio")}</th><th data-sort="title">Role${arrow("title")}</th><th data-sort="posted">Posted${arrow("posted")}</th><th data-sort="fit">Fit${arrow("fit")}</th><th data-sort="status">Status${arrow("status")}</th><th>Source</th></tr></thead>
        <tbody>${rows.map((j) => `<tr class="r" data-rowids="${j.id}"><td>${check(j)}</td><td>${prio(j)}</td><td class="rowtitle" data-open="${j.id}"><b>${esc(j.title)}</b><div class="muted">${company(j)}${j.location ? " · " + esc(j.location) : ""}</div></td>
          <td class="muted">${esc(rel(postedOf(j)))}</td><td>${fit(j)}</td><td><span class="dot" style="background:${STATUS[j.status]?.color}"></span>${esc(STATUS[j.status]?.label || j.status)}${j.has_reply ? ` <span class="chip good">reply</span>` : ""}</td><td class="muted">${esc(SOURCE[j.source] || j.source)}</td></tr>`).join("") || `<tr><td colspan="7"><div class="empty">No jobs match.</div></td></tr>`}</tbody></table></div>`;
  }
  state.visibleIds = () => [...document.querySelectorAll("[data-rowids]")].map((e) => +e.dataset.rowids);

  function renderBulk() {
    const n = state.sel.size;
    $("bulkbar").classList.toggle("show", n > 0);
    $("bulkbar").innerHTML = n ? `<b>${n} selected</b><button class="btn small primary" data-bulk="prepare">Prepare</button><button class="btn small good" data-bulk="applied">Mark applied</button><button class="btn small" data-bulk="skip">Skip</button>
      <span class="menu" data-menu><button class="btn small danger" type="button" data-menu-open>Not a fit ▾</button><span class="items" style="bottom:calc(100% + 4px);top:auto">${Object.entries(REASONS).map(([k, v]) => `<button type="button" data-bulk="discard:${k}">${esc(v)}</button>`).join("")}</span></span>
      <button class="btn small" data-bulk="clear">Clear</button>` : "";
  }

  // ---------------------------------------------------------------- Sources
  function sources() {
    const rows = state.sources; const max = Math.max(1, ...rows.map((r) => r.jobs));
    return `<div class="page-h"><h2>Sources</h2><div class="hint">Which groups, channels, searches and boards actually lead to applications and replies.</div></div>
      <div class="glass" style="overflow-x:auto;border-radius:var(--radius)"><table><thead><tr><th>Source</th><th>Jobs</th><th>Matched</th><th>Prepared</th><th>Applied</th><th>Replies</th><th style="width:30%"></th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td><b>${esc(r.name)}</b><div class="faint">${esc(SOURCE[r.source] || r.source)}</div></td><td class="num">${r.jobs}</td><td class="num">${r.matched}</td><td class="num">${r.prepared}</td><td class="num">${r.applied}</td><td class="num">${r.replies}</td>
        <td><div class="bar-h" style="width:${r.jobs / max * 100}%;opacity:.35"></div><div class="bar-h" style="width:${r.prepared / max * 100}%;margin-top:3px"></div></td></tr>`).join("") || `<tr><td colspan="7"><div class="empty">No data yet.</div></td></tr>`}</tbody></table></div>`;
  }

  // ---------------------------------------------------------------- Profile
  function profile() {
    const p = state.profile; if (!p) return `<div class="empty">Profile not available.</div>`;
    const qs = p.questions || [], answers = Object.entries(p.answers || {});
    return `<div class="page-h"><h2>Profile</h2><div class="hint">What every CV, letter and form answer is built from.</div></div>
      <div class="grid two">
        <div class="panel"><h3 class="grad" style="font-size:20px">${esc(p.candidate.full_name)}</h3><div class="sub">${esc(p.candidate.location)}</div>
          <div class="kv" style="grid-template-columns:90px 1fr"><span class="k">Email</span><span>${esc(p.candidate.email)}</span><span class="k">Phone</span><span>${esc(p.candidate.phone)}</span>
            ${Object.entries(p.candidate.links || {}).map(([k, u]) => `<span class="k">${esc(k)}</span><span>${link(u, u, "")}</span>`).join("")}</div>
          <div>${["projects", "experience", "certifications", "skills", "not_held"].map((k) => `<span class="chip">${esc(p.counts[k])} ${esc(k.replace("_", " "))}</span>`).join("")}</div>
          <div class="faint" style="margin-top:8px">Facts, projects and skills live in <span class="mono">profile/master_profile.yaml</span>; every CV is checked against it.</div></div>
        <div class="panel"><h3>Questions waiting <span class="count ${qs.length ? "hot" : ""}">${qs.length || ""}</span></h3><div class="sub">Asked by application forms; answered once, used on every form after.</div>${qs.length ? questionRows(qs) : `<div class="empty">None. Every question so far had an answer.</div>`}</div>
      </div>
      <div class="panel answers"><h3>Ready answers</h3><div class="sub">Used to fill application forms. Saved straight into your profile file (the previous version is kept as .bak).</div>
        ${answers.map(([k, v]) => `<div class="a"><span class="mono faint">${esc(k)}</span><input type="text" data-akey="${esc(k)}" value="${esc(v)}" aria-label="${esc(k)}"><span class="row-actions"><button class="btn small primary" data-asave="${esc(k)}">Save</button><button class="btn small" data-adel="${esc(k)}">Remove</button></span></div>`).join("")}
        <div class="a"><input type="text" id="newkey" placeholder="new_key, e.g. graduation_year"><input type="text" id="newval" placeholder="answer"><button class="btn small" id="addanswer">Add</button></div></div>
      <div class="panel"><h3>CV headlines</h3><div class="sub">One per angle; the agent picks the angle from the job title.</div>
        ${Object.keys(p.headlines || {}).map((a) => `<details style="margin:8px 0"><summary><b>${esc(a)}</b> · <span class="muted">${esc(p.headlines[a])}</span></summary><p class="muted">${esc(p.summaries[a])}</p></details>`).join("")}
        <div style="margin-top:10px">${(p.certifications || []).map((c) => `<span class="chip accent">${esc(c)}</span>`).join("")}</div></div>`;
  }

  // ---------------------------------------------------------------- Settings
  function chipEditor(field, items, placeholder) {
    return `<div class="chipedit">${(items || []).map((x, i) => `<span class="chip accent">${esc(x)}<span class="x" data-chipdel="${field}:${i}" title="Remove">✕</span></span>`).join("")}
      <input type="text" data-chipadd="${field}" placeholder="${esc(placeholder)}"></div>`;
  }
  function settings() {
    const s = state.settings; if (!s) return `<div class="empty">Settings not available.</div>`;
    const ro = state.editable ? "" : `<div class="banner show">Settings are read-only in this view.</div>`;
    const sw = (field, on) => `<label class="switch"><input type="checkbox" data-switch="${field}" ${on ? "checked" : ""}><span></span></label>`;
    const num = (field, v, min, max) => `<input type="number" data-num="${field}" value="${esc(v)}" min="${min}" max="${max}" style="width:100px">`;
    return `<div class="page-h"><h2>Settings</h2><div class="hint">Saved into config/config.yaml and config/titles.yaml (each change is checked; the previous file is kept as .bak). Used from the next run.</div></div>${ro}
      ${state.sugg.length ? `<div class="panel" style="border-color:rgb(var(--a3) / .45)"><h3>Rules learned from "Not a fit"</h3><div class="sub">Apply one and the agent stops bringing those jobs; dismiss it and it won't be suggested again.</div>
        ${state.sugg.map((g) => `<div class="q"><div><b>${g.kind === "exclude_title" ? `Exclude titles with “${esc(g.value)}”` : `Block ${esc(g.value)}`}</b><div class="faint">${esc(g.why)}</div></div><span></span><span class="row-actions"><button class="btn small primary" data-sugg="apply:${esc(g.key)}">Apply</button><button class="btn small" data-sugg="dismiss:${esc(g.key)}">Dismiss</button></span></div>`).join("")}</div>` : ""}
      <div class="panel"><h3>Search</h3><div class="sub">LinkedIn's public job search runs each title for jobs posted since the last run (at most 24 h).</div>
        <div class="setrow"><div class="lbl"><b>LinkedIn search</b><span class="faint">Replaces LinkedIn's alert emails</span></div><div>${sw("linkedin_enabled", s.linkedin_enabled)}</div></div>
        <div class="setrow"><div class="lbl"><b>Job titles</b><span class="faint">Press Enter to add</span></div>${chipEditor("search_titles", s.search_titles, "Add a title, e.g. SRE")}</div>
        <div class="setrow"><div class="lbl"><b>Locations</b><span class="faint">Up to 5</span></div>${chipEditor("search_locations", s.search_locations, "e.g. Egypt")}</div></div>
      <div class="panel"><h3>Sources</h3>
        <div class="setrow"><div class="lbl"><b>WhatsApp channels</b><span class="faint">Every channel you follow</span></div><div>${sw("channels_follow_all", s.channels_follow_all)}</div></div>
        <div class="setrow"><div class="lbl"><b>Channels to leave out</b><span class="faint">Names or ids</span></div>${chipEditor("channels_exclude", s.channels_exclude, "Channel name")}</div>
        <div class="setrow"><div class="lbl"><b>Job-alert emails</b><span class="faint">Indeed, Wuzzuf, Bayt (LinkedIn's are skipped)</span></div><div>${sw("alerts_enabled", s.alerts_enabled)}</div></div>
        <div class="setrow"><div class="lbl"><b>Company boards</b><span class="faint">Configured and discovered</span></div><div>${sw("ats_enabled", s.ats_enabled)}</div></div></div>
      <div class="panel"><h3>Filters and scoring</h3>
        <div class="setrow"><div class="lbl"><b>Maximum job age</b><span class="faint">Days since posted</span></div>${num("max_job_age_days", s.max_job_age_days, 1, 365)}</div>
        <div class="setrow"><div class="lbl"><b>Maximum years asked</b></div>${num("max_years_required", s.max_years_required, 0, 20)}</div>
        <div class="setrow"><div class="lbl"><b>Fit thresholds</b><span class="faint">P1 target · P2 adjacent · P3 other</span></div><div class="row-actions">P1 ${num("thresholds.p1", s.thresholds.p1, 0, 100)} P2 ${num("thresholds.p2", s.thresholds.p2, 0, 100)} P3 ${num("thresholds.p3", s.thresholds.p3, 0, 100)}</div></div>
        <div class="setrow"><div class="lbl"><b>Excluded titles</b><span class="faint">Patterns, e.g. sales or \\bqa\\b</span></div>${chipEditor("excluded_titles", s.excluded_titles, "Add a pattern")}</div></div>
      <div class="panel"><h3>Companies</h3>
        <div class="setrow"><div class="lbl"><b>Favorites ★</b><span class="faint">Always prepared</span></div>${chipEditor("favorite_companies", s.favorite_companies, "Company name")}</div>
        <div class="setrow"><div class="lbl"><b>Blocked</b><span class="faint">Never applied to</span></div>${chipEditor("blocked_companies", s.blocked_companies, "Company name")}</div></div>`;
  }
  async function saveSettings(change, msg) {
    const r = await post("/api/settings", change, msg || "Settings saved");
    if (r) { state.settings = r.settings; render(); }
  }

  // ---------------------------------------------------------------- Companies, Runs
  function companies() {
    const cs = state.stats?.companies || [];
    return `<div class="page-h"><h2>Companies</h2><div class="hint">Boards polled every run: from your config, and found automatically from job links.</div></div>
      ${cs.length ? `<div class="cards">${cs.map((c) => `<div class="card"><div class="top"><b style="font-family:var(--display)">${esc(c.name)}</b><span class="chip ${c.source === "discovered" ? "accent" : ""}">${esc(c.source)}</span></div>
        <div class="muted mono">${esc(c.ats)} · ${esc(c.board || c.url || "")}${c.active ? "" : ` <span class="chip bad">off: failing</span>`}</div><div class="faint">${esc(c.evidence || "from config/companies.yaml")}</div></div>`).join("")}</div>` : `<div class="empty">None yet.</div>`}`;
  }
  function runs() {
    return `<div class="page-h"><h2>Runs</h2><div class="hint">Every run, newest first.</div></div>
      <div class="glass" style="overflow-x:auto;border-radius:var(--radius)"><table><thead><tr><th>#</th><th>When</th><th>Status</th><th>Took</th><th>Items</th><th>Applications</th><th>Model calls</th><th>Note</th></tr></thead><tbody>
      ${state.runs.map((r) => { const s = r.stats || {}; const a = s.applications || {}; return `<tr><td class="mono">${r.id}</td><td class="muted">${esc(new Date(r.started_at).toLocaleString())}${r.mode === "dry_run" ? ` <span class="chip">dry run</span>` : ""}</td>
        <td><span class="chip ${r.status === "success" ? "good" : r.status === "partial" ? "warn" : "bad"}">${esc(r.status)}</span></td><td class="muted">${r.finished_at ? Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 60000) + " min" : "—"}</td>
        <td class="muted">${s.items ? `${s.items.processed} read, ${s.items.left} left` : "—"}</td><td class="muted">${s.applications ? `${a.drafts || 0} drafts, ${a.submitted || 0} submitted, ${a.packages || 0} yourself` : "—"}</td>
        <td class="muted">${s.llm ? `${s.llm.calls} (${s.llm.failed} failed)` : "—"}</td><td class="faint">${esc(r.error || "")}</td></tr>`; }).join("") || `<tr><td colspan="8"><div class="empty">No runs yet.</div></td></tr>`}</tbody></table></div>`;
  }

  // ---------------------------------------------------------------- drawer
  function prepHtml(p) {
    if (!p) return "";
    return `${(p.questions || []).map((q, i) => `<details ${i < 2 ? "open" : ""} style="margin:8px 0"><summary><b>${esc(q.question)}</b></summary><div class="faint" style="margin:4px 0">${esc(q.why)}</div><ul style="margin:4px 0 0 18px;padding:0">${(q.answer_points || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${(q.evidence || []).length ? `<div style="margin-top:4px">${q.evidence.map((e) => `<span class="chip mono">${esc(e)}</span>`).join("")}</div>` : ""}</details>`).join("")}
      ${(p.gaps || []).length ? `<div class="faint" style="margin-top:10px">Gaps and how to answer them honestly</div>${p.gaps.map((g) => `<div class="reason" style="margin-top:6px"><b>${esc(g.gap)}</b>: ${esc(g.how)}</div>`).join("")}` : ""}
      ${(p.questions_to_ask || []).length ? `<div class="faint" style="margin-top:10px">Ask them</div><ul style="margin:4px 0 0 18px;padding:0">${p.questions_to_ask.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}`;
  }
  function openDrawer(id) {
    const j = state.jobs.find((x) => x.id === id) || state.dup.find((x) => x.id === id); if (!j) return;
    state.open = id;
    const chips = (arr, cls) => (arr || []).map((x) => `<span class="chip ${cls}">${esc(x)}</span>`).join("");
    const sel = `<select id="dstatus" aria-label="Status">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === j.status ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select>`;
    const done = ["applied", "interview", "offer", "rejected"].includes(j.status);
    const editable = j.cover_text && !done;
    const fav = inList(j.company, state.settings?.favorite_companies), blk = inList(j.company, state.settings?.blocked_companies);
    const due = state.follow.find((f) => f.job_id === j.id);
    $("drawer").innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px"><div><div class="faint mono">job ${j.id} · ${esc(SOURCE[j.source] || j.source)}</div><h2>${esc(j.title)}</h2><div class="muted">${company(j)}${j.location ? " · " + esc(j.location) : ""}${j.work_mode && j.work_mode !== "unknown" ? " · " + esc(j.work_mode) : ""}</div></div><button class="btn small" id="dclose">Esc</button></div>
      <div class="row-actions" style="margin:14px 0">${link(j.apply_url_direct, "Company form", "btn small primary")}${link(j.apply_url, "Listing")}${link(j.gmail_draft_url, "Gmail draft")}${docs(j)}${j.files?.cv ? `<button class="btn small" id="dcv">${state.cv ? "Hide CV" : "Preview CV"}</button>` : ""}</div>
      ${state.cv && j.files?.cv ? `<iframe class="cv" src="${esc(j.files.cv)}" title="CV preview"></iframe>` : ""}
      <div class="row-actions">${["skipped", "needs_review"].includes(j.status) ? `<button class="btn small primary" data-status="${j.id}:new">Prepare anyway</button>` : ""}${j.status === "ready" ? `<button class="btn small good" data-status="${j.id}:applied">Mark applied</button>` : ""}${!done && j.status !== "skipped" ? notFit(j.id) : ""}
        ${j.company ? `<button class="btn small" data-fav="${esc(j.company)}">${fav ? "★ Favorite" : "☆ Favorite company"}</button><button class="btn small ${blk ? "danger" : ""}" data-block="${esc(j.company)}">${blk ? "Blocked" : "Block company"}</button>` : ""}
        ${due ? `<button class="btn small primary" data-follow="${j.id}">Draft follow-up</button>` : ""}</div>
      <div class="kv">
        <span class="k">Status</span><span>${sel}</span>
        <span class="k">Fit</span><span>${fit(j)} ${j.scores ? `<span class="faint">skills ${j.scores.skills} · experience ${j.scores.experience}</span>` : ""} ${prio(j)}</span>
        <span class="k">Posted</span><span>${esc(rel(postedOf(j)))}${j.job_posted_at ? "" : ` <span class="faint">(date of the post or alert)</span>`}</span>
        <span class="k">Found via</span><span>${esc(j.source_name || SOURCE[j.source] || j.source)}${j.seen_count > 1 ? ` · seen ${j.seen_count}×` : ""}</span>
        <span class="k">Apply via</span><span>${esc(j.apply_channel)}${j.apply_email ? " · " + esc(j.apply_email) : ""}${j.apply_phone ? " · " + esc(j.apply_phone) : ""}</span>
        ${j.skip_reason ? `<span class="k">Reason</span><span>${esc(j.skip_reason)}</span>` : ""}
        ${j.manual_reason ? `<span class="k">Why by hand</span><span>${esc(j.manual_reason)}</span>` : ""}
        ${j.company_board ? `<span class="k">Company board</span><span class="mono">${esc(j.company_board)}</span>` : ""}
        ${j.ats_keywords != null ? `<span class="k">CV keywords</span><span>${Math.round(j.ats_keywords * 100)}% of the job's backed keywords</span>` : ""}
      </div>
      ${j.why_this_role ? `<h4>Why this role · your interview line</h4><div class="reason">${esc(j.why_this_role)}</div>` : ""}
      ${j.fit_summary ? `<h4>Fit</h4><div>${esc(j.fit_summary)}</div>` : ""}
      ${(j.matched || []).length || (j.missing || []).length ? `<h4>Requirements</h4><div>${chips(j.matched, "good")}${chips(j.missing, "bad")}</div>` : (j.requirements || []).length ? `<h4>Requirements</h4><div>${chips(j.requirements, "")}</div>` : ""}
      <h4>Interview prep</h4>${j.interview_prep ? prepHtml(j.interview_prep) : ""}<div class="row-actions" style="margin-top:8px"><button class="btn small ${j.interview_prep ? "" : "primary"}" data-prep="${j.id}">${j.interview_prep ? "Make it again" : "Prepare me for this interview"}</button><span class="faint">Likely questions, answers from your real projects, honest gaps. About a minute.</span></div>
      ${(j.form_filled || []).length ? `<h4>What the agent filled in the form</h4><div class="kv">${j.form_filled.map((f) => `<span class="k">${esc(f.label)}</span><span>${esc(f.value)}</span>`).join("")}</div>${(j.form_unanswered || []).length ? `<div class="reason">Left for you: ${j.form_unanswered.map(esc).join("; ")}</div>` : ""}` : ""}
      ${j.cover_text ? `<h4>Cover letter</h4><textarea id="dcover" rows="14" ${editable ? "" : "disabled"} aria-label="Cover letter">${esc(j.cover_text)}</textarea>
        <div class="row-actions" style="margin-top:6px">${editable ? `<button class="btn small primary" id="dsavecover">Save letter</button>` : ""}<button class="btn small" id="dcopy">Copy</button><span class="faint">${j.apply_channel === "email" ? "Email jobs: the Gmail draft is what gets sent; edit it there." : "Used by ./agent.sh apply and for paste boxes."}</span></div>` : ""}
      <h4>Notes</h4><textarea id="dnotes" rows="3" placeholder="Interview date, contact, follow-up…" aria-label="Notes">${esc(j.notes || "")}</textarea><div style="margin-top:6px"><button class="btn small" id="dsavenotes">Save notes</button></div>
      ${j.post_text ? `<h4>Original post</h4><pre class="post">${esc(j.post_text)}</pre>` : ""}`;
    $("drawer").classList.add("open"); $("scrim").classList.add("open");
  }
  function closeDrawer() { state.open = null; state.cv = false; $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }

  async function saveAnswer(key, value, questionId) {
    try {
      const r = await api("/api/profile/answers", { method: "PUT", body: JSON.stringify({ key, value, ...(questionId ? { question_id: questionId } : {}) }) });
      state.profile.answers = r.answers; state.profile.questions = r.questions;
      toast(value ? `Saved "${key}"${questionId ? ". Waiting forms are retried on the next run" : ""}` : `Removed "${key}"`);
      render();
    } catch (e) { toast(`Not saved: ${e.message}`); }
  }
  async function discard(id, reason) {
    const r = await post(`/api/jobs/${id}/discard`, { reason }, (x) => `Marked not a fit${x.draftDeleted ? "; its Gmail draft was deleted" : ""}${x.draftNote ? ` (${x.draftNote})` : ""}`);
    if (!r) return;
    const j = state.jobs.find((x) => x.id === id); if (j) Object.assign(j, { status: "skipped", skip_reason: `discarded: ${reason}`, discard_reason: reason });
    state.sugg = r.suggestions || state.sugg;
    if (r.suggestions?.length) toast(`Marked not a fit. ${r.suggestions.length} rule suggestion${r.suggestions.length > 1 ? "s" : ""} in Settings.`);
    if (state.open === id) closeDrawer();
    render();
  }

  // ---------------------------------------------------------------- events
  document.addEventListener("click", async (e) => {
    const t = e.target;
    const mo = t.closest("[data-menu-open]");
    document.querySelectorAll(".menu.open").forEach((m) => { if (!mo || m !== mo.closest(".menu")) m.classList.remove("open"); });
    if (mo) { mo.closest(".menu").classList.toggle("open"); return; }
    if (t.id === "runbtn") { $("runmenu").classList.toggle("open"); return; }
    $("runmenu").classList.remove("open");
    const rn = t.closest("[data-run]"); if (rn) return startRun(rn.dataset.run === "dry");
    if (t.id === "closerun") { state.run = { ...state.run, lines: [] }; renderRun(); return; }
    const go = t.closest("[data-go]"); if (go) { location.hash = go.dataset.go; return; }
    const st = t.closest("[data-status]"); if (st) { const [id, s] = st.dataset.status.split(":"); return patch(+id, { status: s }, s === "new" ? `Queued: the next run prepares it` : `Moved to ${STATUS[s].label}`); }
    const dc = t.closest("[data-discard]"); if (dc) { const [id, r] = dc.dataset.discard.split(":"); return discard(+id, r); }
    const bk = t.closest("[data-bulk]");
    if (bk) {
      const a = bk.dataset.bulk; if (a === "clear") { state.sel.clear(); return render(); }
      const [action, reason] = a.split(":");
      const r = await post("/api/jobs/bulk", { ids: [...state.sel], action, ...(reason ? { reason } : {}) }, (x) => `${x.done} updated${x.failed.length ? `, ${x.failed.length} failed` : ""}`);
      if (r) { state.sel.clear(); await load(); }
      return;
    }
    if (t.id === "selall") { state.visibleIds().forEach((i) => state.sel.add(i)); return render(); }
    const op = t.closest("[data-open]"); if (op && !t.closest("a, button, select, input")) { openDrawer(+op.dataset.open); return; }
    const an = t.closest("[data-answer]");
    if (an) { const v = document.querySelector(`[data-qinput="${an.dataset.answer}"]`).value.trim(); if (!v) return toast("Type an answer first"); return saveAnswer(an.dataset.key, v, +an.dataset.answer); }
    const as = t.closest("[data-asave]"); if (as) return saveAnswer(as.dataset.asave, document.querySelector(`[data-akey="${CSS.escape(as.dataset.asave)}"]`).value);
    const ad = t.closest("[data-adel]"); if (ad) { if (confirm(`Remove the answer "${ad.dataset.adel}"?`)) saveAnswer(ad.dataset.adel, ""); return; }
    if (t.id === "addanswer") { const k = $("newkey").value.trim(), v = $("newval").value.trim(); if (!k || !v) return toast("Fill in both the key and the answer"); return saveAnswer(k, v); }
    const cd = t.closest("[data-chipdel]"); if (cd) { const [f, i] = cd.dataset.chipdel.split(":"); const list = [...state.settings[f]]; list.splice(+i, 1); return saveSettings({ [f]: list }, "Removed"); }
    const sg = t.closest("[data-sugg]");
    if (sg) { const [a, ...k] = sg.dataset.sugg.split(":"); const r = await post(`/api/suggestions/${a}`, { key: k.join(":") }, a === "apply" ? "Rule applied: used from the next run" : "Dismissed"); if (r) { state.sugg = r.suggestions; if (r.settings) state.settings = r.settings; render(); } return; }
    const fv = t.closest("[data-fav]");
    if (fv) { const c = fv.dataset.fav, list = state.settings.favorite_companies; const on = inList(c, list); await saveSettings({ favorite_companies: on ? list.filter((x) => norm(x) !== norm(c)) : [...list, c] }, on ? `${c} is no longer a favorite` : `★ ${c}: always prepared from now on`); if (state.open) openDrawer(state.open); return; }
    const bl = t.closest("[data-block]");
    if (bl) { const c = bl.dataset.block, list = state.settings.blocked_companies; const on = inList(c, list); if (!on && !confirm(`Never apply to ${c} again?`)) return; await saveSettings({ blocked_companies: on ? list.filter((x) => norm(x) !== norm(c)) : [...list, c] }, on ? `${c} unblocked` : `${c} blocked`); if (state.open) openDrawer(state.open); return; }
    const fu = t.closest("[data-follow]");
    if (fu) { fu.disabled = true; const r = await post(`/api/jobs/${fu.dataset.follow}/followup`, {}, "Follow-up drafted in Gmail: review and send it there"); if (r) { if (r.draft_url) window.open(r.draft_url, "_blank", "noopener"); await load(); } fu.disabled = false; return; }
    const pp = t.closest("[data-prep]");
    if (pp) { pp.disabled = true; pp.textContent = "Preparing… (about a minute)"; const id = +pp.dataset.prep; const r = await post(`/api/jobs/${id}/prep`, {}, "Interview prep ready"); if (r) { const j = state.jobs.find((x) => x.id === id); if (j) j.interview_prep = r.prep; openDrawer(id); } else { pp.disabled = false; pp.textContent = "Try again"; } return; }
    if (t.id === "dcv") { state.cv = !state.cv; return openDrawer(state.open); }
    if (t.id === "dclose") return closeDrawer();
    if (t.id === "dsavecover") return patch(state.open, { cover_text: $("dcover").value });
    if (t.id === "dsavenotes") return patch(state.open, { notes: $("dnotes").value }, "Notes saved");
    if (t.id === "dcopy") { navigator.clipboard?.writeText($("dcover").value).then(() => toast("Letter copied"), () => toast("Copy failed: select the text and copy")); return; }
    const th = t.closest("th[data-sort]"); if (th) { const k = th.dataset.sort; state.sort = { k, d: state.sort.k === k ? -state.sort.d : -1 }; render(); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.sel) { const id = +t.dataset.sel; t.checked ? state.sel.add(id) : state.sel.delete(id); return renderBulk(); }
    if (t.id === "dstatus") return patch(state.open, { status: t.value }, `Moved to ${STATUS[t.value].label}`);
    if (t.id === "fstatus") { state.status = t.value; render(); }
    if (t.id === "fsource") { state.source = t.value; render(); }
    if (t.id === "showdup") { state.showDup = t.checked; render(); }
    if (t.dataset.switch) return saveSettings({ [t.dataset.switch]: t.checked });
    if (t.dataset.num) {
      const v = +t.value; const [a, b] = t.dataset.num.split(".");
      return saveSettings(b ? { thresholds: { ...state.settings.thresholds, [b]: v } } : { [a]: v });
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id !== "q") return;
    state.q = e.target.value; const pos = e.target.selectionStart; render();
    const q = $("q"); q.focus(); q.setSelectionRange(pos, pos);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeDrawer(); document.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open")); }
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); location.hash = "all"; setTimeout(() => $("q")?.focus(), 0); }
    if (e.key === "Enter" && e.target.dataset?.qinput) document.querySelector(`[data-answer="${e.target.dataset.qinput}"]`)?.click();
    if (e.key === "Enter" && e.target.dataset?.chipadd) {
      const f = e.target.dataset.chipadd, v = e.target.value.trim(); if (!v) return;
      saveSettings({ [f]: [...(state.settings[f] || []), v] }, `Added "${v}"`);
    }
  });
  document.addEventListener("dragstart", (e) => { const c = e.target.closest?.("[data-drag]"); if (c) e.dataTransfer.setData("text/plain", c.dataset.drag); });
  document.addEventListener("dragover", (e) => { const col = e.target.closest?.("[data-col]"); if (col) { e.preventDefault(); col.classList.add("drop"); } });
  document.addEventListener("dragleave", (e) => { e.target.closest?.("[data-col]")?.classList.remove("drop"); });
  document.addEventListener("drop", (e) => { const col = e.target.closest?.("[data-col]"); if (!col) return; e.preventDefault(); col.classList.remove("drop"); const id = +e.dataTransfer.getData("text/plain"); if (id) patch(id, { status: col.dataset.col }, `Moved to ${STATUS[col.dataset.col].label}`); });

  function route() { state.tab = (location.hash || "#today").slice(1) || "today"; closeDrawer(); render(); window.scrollTo(0, 0); }
  window.addEventListener("hashchange", route);
  $("scrim").addEventListener("click", closeDrawer);
  $("refresh").addEventListener("click", () => load().then(() => toast("Refreshed")));
  try { const th = localStorage.getItem("ja-theme"); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
  $("theme").addEventListener("click", () => {
    const light = document.documentElement.dataset.theme === "light";
    document.documentElement.dataset.theme = light ? "dark" : "light";
    try { localStorage.setItem("ja-theme", document.documentElement.dataset.theme); } catch (_) {}
  });
  const tick = () => { $("clock").textContent = new Date().toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" }); };
  tick(); setInterval(tick, 30000);
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => state.tab === "today" && drawChart(), 150); });
  state.tab = (location.hash || "#today").slice(1) || "today";
  load().then(() => { if (state.run?.running) { notified = false; runPoll = setInterval(pollRun, 2000); } });
  setInterval(() => { if (!state.open && !state.run?.running && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) load(); }, 120000);
})();
</script>
</body>
</html>
