<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3f0; --panel: #fcfcfb; --panel-2: #f0efec; --border: #e2e1dc;
    --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
    --accent: #2a78d6; --accent-soft: #e3eefb;
    --good: #0ca30c; --good-text: #006300; --good-soft: #e3f4e3;
    --warn: #fab219; --warn-text: #7a5200; --warn-soft: #fdf1d6;
    --bad: #d03b3b; --bad-soft: #f8e1e1;
    --chip: #ecebe7; --shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211; --panel: #1a1a19; --panel-2: #232322; --border: #34332f;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
      --accent: #3987e5; --accent-soft: #1d2c40; --good-text: #3fc43f; --good-soft: #17301a;
      --warn-text: #fab219; --warn-soft: #3a2f12; --bad-soft: #3a1c1c; --chip: #2a2a28; --shadow: 0 8px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --panel: #1a1a19; --panel-2: #232322; --border: #34332f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5; --accent-soft: #1d2c40; --good-text: #3fc43f; --good-soft: #17301a;
    --warn-text: #fab219; --warn-soft: #3a2f12; --bad-soft: #3a1c1c; --chip: #2a2a28; --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; }

  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav.side { background: var(--panel); border-right: 1px solid var(--border); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav.side h1 { font-size: 17px; margin: 4px 10px 2px; }
  nav.side .sub { color: var(--muted); font-size: 12px; margin: 0 10px 14px; }
  nav.side a.tab { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--text); text-decoration: none; margin-bottom: 2px; }
  nav.side a.tab:hover { background: var(--panel-2); }
  nav.side a.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .count { font-size: 11.5px; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .count:empty { display: none; }
  .count.hot { background: var(--warn); color: #3a2600; font-weight: 700; }
  nav.side .foot { margin: 18px 10px 0; display: flex; gap: 6px; flex-wrap: wrap; }

  main { padding: 22px clamp(14px, 3vw, 36px) 60px; min-width: 0; }
  .page-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-h h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .page-h .hint { color: var(--text-2); }
  .banner { background: var(--warn-soft); color: var(--warn-text); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; display: none; }
  .banner.show { display: block; }

  .grid { display: grid; gap: 14px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 14px; }
  .tile, .card, .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .tile { padding: 14px 16px; }
  .tile.link { cursor: pointer; } .tile.link:hover { border-color: var(--accent); }
  .tile .label { color: var(--text-2); font-size: 12px; }
  .tile .value { font-size: 28px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .hint { color: var(--muted); font-size: 12px; }
  .panel { padding: 14px 16px; margin-bottom: 14px; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; }
  .panel .sub { color: var(--text-2); font-size: 12.5px; margin-bottom: 10px; }
  .two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

  .callout { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 14px; flex-wrap: wrap; }
  .callout b { font-size: 15px; }
  .callout .grow { flex: 1; }

  .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .card { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .title[data-open] { cursor: pointer; font-weight: 650; }
  .title[data-open]:hover { color: var(--accent); }
  .muted { color: var(--text-2); font-size: 12.5px; }
  .faint { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--text-2); margin: 0 4px 4px 0; }
  .chip.warn { background: var(--warn-soft); color: var(--warn-text); }
  .chip.good { background: var(--good-soft); color: var(--good-text); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .reason { background: var(--panel-2); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; color: var(--text-2); }
  .fit { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .fitbar { width: 48px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .fitbar i { display: block; height: 100%; background: var(--accent); }
  .prio { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--chip); color: var(--text-2); }
  .prio.p1 { background: var(--accent); color: #fff; }

  .section-title { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
  .section-title h3 { margin: 0; font-size: 16px; }
  .empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; }

  .board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { background: var(--panel-2); border-radius: 12px; padding: 10px; min-height: 200px; }
  .col h4 { margin: 2px 4px 10px; font-size: 13px; display: flex; justify-content: space-between; }
  .col.drop { outline: 2px dashed var(--accent); }
  .mini { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; cursor: grab; }

  details.group { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; }
  details.group > summary { padding: 11px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary .what { flex: 1; color: var(--text-2); font-size: 12.5px; }
  .li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--border); align-items: center; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  input[type=search], input[type=text], select, textarea { font: inherit; font-size: 13px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  input[type=search] { min-width: 260px; }
  textarea { width: 100%; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--text-2); padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th[data-sort] { cursor: pointer; }
  td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.r { cursor: pointer; } tr.r:hover td { background: var(--panel-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  aside.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(640px, 100vw); background: var(--panel); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .18s ease; z-index: 11; overflow-y: auto; padding: 18px 20px 40px; }
  aside.drawer.open { transform: none; }
  .drawer h2 { margin: 0 0 2px; font-size: 19px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 13px; margin: 10px 0; }
  .kv .k { color: var(--text-2); }
  .drawer h4 { margin: 18px 0 6px; font-size: 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  pre.post { white-space: pre-wrap; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel-2); padding: 10px; border-radius: 8px; max-height: 320px; overflow: auto; }

  .answers .a { display: grid; grid-template-columns: 220px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .answers .a:last-child { border-bottom: 0; }
  .answers code { font-size: 12px; color: var(--text-2); }
  .q { display: grid; grid-template-columns: 1fr minmax(200px, 320px) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(30px); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; opacity: 0; transition: all .2s; z-index: 20; font-size: 13px; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  .chart { height: 140px; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .funnel .step { display: grid; grid-template-columns: 110px 1fr 46px; gap: 10px; align-items: center; margin: 6px 0; font-size: 13px; }
  .funnel .bar { height: 10px; border-radius: 5px; background: var(--accent); min-width: 2px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    nav.side { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; }
    nav.side h1, nav.side .sub, nav.side .foot { display: none; }
    .board { grid-template-columns: repeat(4, 240px); }
    .answers .a, .q { grid-template-columns: 1fr; }
    input[type=search] { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav">
    <h1>Job Tracker</h1>
    <div class="sub" id="nav-sub">loading…</div>
    <a class="tab" href="#today" data-tab="today">Today <span class="count" id="c-today"></span></a>
    <a class="tab" href="#action" data-tab="action">Needs action <span class="count" id="c-action"></span></a>
    <a class="tab" href="#applied" data-tab="applied">Applied <span class="count" id="c-applied"></span></a>
    <a class="tab" href="#skipped" data-tab="skipped">Skipped <span class="count" id="c-skipped"></span></a>
    <a class="tab" href="#all" data-tab="all">All jobs <span class="count" id="c-all"></span></a>
    <a class="tab" href="#profile" data-tab="profile">Profile <span class="count" id="c-profile"></span></a>
    <a class="tab" href="#companies" data-tab="companies">Companies <span class="count" id="c-companies"></span></a>
    <a class="tab" href="#runs" data-tab="runs">Runs <span class="count" id="c-runs"></span></a>
    <div class="foot">
      <button class="btn small" id="refresh" type="button">Refresh</button>
      <button class="btn small" id="theme" type="button">Theme</button>
    </div>
  </nav>
  <main>
    <div class="banner" id="banner"></div>
    <section id="view"></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Job details"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Job posts are untrusted: only http(s) links are ever rendered as links.
  const safeUrl = (u) => { if (!u) return null; try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
  const link = (u, label, cls = "btn small") => { const s = safeUrl(u); return s ? `<a class="${cls}" href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : ""; };

  const STATUS = {
    new: { label: "Queued for next run", color: "var(--muted)" },
    needs_review: { label: "Needs review", color: "var(--warn)" },
    ready: { label: "Ready", color: "var(--accent)" },
    applied: { label: "Applied", color: "var(--text-2)" },
    interview: { label: "Interview", color: "var(--good)" },
    offer: { label: "Offer", color: "var(--good)" },
    rejected: { label: "Rejected", color: "var(--bad)" },
    skipped: { label: "Skipped", color: "var(--border)" },
  };
  const SKIP = {
    stale: ["Too old", "Posted longer ago than your age limit (alert emails also recommend old jobs)."],
    low_fit: ["Low fit", "Your skills score was below the threshold for this kind of title."],
    over_experience: ["Over 3 years", "The post asks for more years than your limit."],
    excluded_title: ["Excluded title", "Sales, HR, accounting and the other titles you excluded."],
    location: ["Location", "Outside the countries you accept and not remote."],
    deadline_passed: ["Deadline passed", "The application deadline is over."],
    duplicate: ["Duplicate", "The same job seen in another group, alert or board."],
    other: ["Other", ""],
  };
  const SOURCE = { whatsapp: "WhatsApp", whatsapp_export: "WhatsApp", alert_email: "Job alert", ats: "Company board", html: "Careers page", manual: "Added by hand" };

  const state = { jobs: [], dup: [], stats: null, profile: null, runs: [], tab: "today", q: "", status: "", source: "", sort: { k: "posted", d: -1 }, showDup: false, open: null };

  // ---------------------------------------------------------------- helpers
  const rel = (iso) => {
    if (!iso) return "—";
    const m = (Date.now() - new Date(iso)) / 60000;
    if (m < 60) return `${Math.max(1, Math.round(m))}m ago`;
    if (m < 1440) return `${Math.round(m / 60)}h ago`;
    const d = Math.round(m / 1440);
    return d < 45 ? `${d}d ago` : `${Math.round(d / 30)} months ago`;
  };
  const postedOf = (j) => j.job_posted_at || j.posted_at;
  const fit = (j) => j.fit_score == null ? `<span class="faint">no score</span>` : `<span class="fit"><span class="fitbar"><i style="width:${Math.max(0, Math.min(100, j.fit_score))}%"></i></span>${j.fit_score}</span>`;
  const prio = (j) => j.priority ? `<span class="prio ${j.priority === 1 ? "p1" : ""}">P${j.priority}</span>` : "";
  const company = (j) => esc(j.company || "Company not named");
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800); };
  const by = (s) => state.jobs.filter((j) => j.status === s);
  const isManual = (j) => j.status === "ready" && (j.app_mode === "manual" || j.app_mode === "package");
  const isDraft = (j) => j.status === "ready" && j.apply_channel === "email";
  const appliedSet = () => state.jobs.filter((j) => ["applied", "interview", "offer", "rejected"].includes(j.status));

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    return body;
  }

  async function load() {
    try {
      const [j, d, s, p, r] = await Promise.all([
        api("/api/jobs"), api("/api/jobs?include_duplicates=true&status=skipped"), api("/api/stats"), api("/api/profile"), api("/api/runs"),
      ]);
      state.jobs = j.jobs; state.dup = d.jobs.filter((x) => x.skip_reason === "duplicate"); state.stats = s; state.profile = p; state.runs = r.runs;
      $("banner").classList.remove("show");
    } catch (e) {
      $("banner").textContent = `The agent's API isn't reachable (${e.message}). Start it with ./agent.sh dashboard.`;
      $("banner").classList.add("show");
    }
    render();
  }

  async function patch(id, body, msg) {
    try {
      const r = await api(`/api/jobs/${id}`, { method: "PATCH", body: JSON.stringify(body) });
      const j = state.jobs.find((x) => x.id === id);
      if (j) Object.assign(j, body);
      toast(r.note || msg || "Saved");
      render();
      if (state.open === id) openDrawer(id);
    } catch (e) { toast(`Not saved: ${e.message}`); }
  }

  // ---------------------------------------------------------------- nav + counts
  function counts() {
    const qs = state.profile?.questions?.length || 0;
    const action = state.jobs.filter((j) => isManual(j) || isDraft(j) || j.status === "needs_review").length + qs;
    const set = (id, n, hot) => { const el = $(id); el.textContent = n ? n : ""; el.classList.toggle("hot", !!hot && n > 0); };
    set("c-action", action, true);
    set("c-applied", appliedSet().length);
    set("c-skipped", by("skipped").length);
    set("c-all", state.jobs.length);
    set("c-profile", qs, true);
    set("c-companies", state.stats?.companies?.length || 0);
    set("c-runs", state.runs.length);
    const r = state.stats?.last_run;
    $("nav-sub").textContent = r ? `last run ${rel(r.finished_at || r.started_at)} · ${r.status}` : "no runs yet";
    document.querySelectorAll("a.tab").forEach((a) => a.classList.toggle("active", a.dataset.tab === state.tab));
  }

  function render() {
    counts();
    const v = { today, action, applied, skipped, all, profile, companies, runs }[state.tab] || today;
    $("view").innerHTML = v();
    if (state.tab === "today") drawChart();
  }

  // ---------------------------------------------------------------- Today
  function today() {
    const J = state.jobs, s = state.stats || {}, r = s.last_run, stats = r?.stats || {};
    const manual = J.filter(isManual), drafts = J.filter(isDraft), review = by("needs_review"), qs = state.profile?.questions || [];
    const todo = manual.length + drafts.length + review.length + qs.length;
    const week = appliedSet().filter((j) => (Date.now() - new Date(j.applied_at || j.posted_at)) / 864e5 <= 7).length;
    const replies = appliedSet().filter((j) => j.has_reply || ["interview", "offer"].includes(j.status)).length;
    const fresh = J.filter((j) => j.status !== "skipped" && (Date.now() - new Date(postedOf(j))) / 36e5 <= 24).length;
    const tiles = [
      ["Need you", todo, "drafts, forms, questions", "action"],
      ["Drafts to send", drafts.length, "review in Gmail", "action"],
      ["Apply yourself", manual.length, "pre-filled, one click", "action"],
      ["Applied this week", week, `${appliedSet().length} all time`, "applied"],
      ["Interviews", J.filter((j) => ["interview", "offer"].includes(j.status)).length, "incl. offers", "applied"],
      ["Response rate", appliedSet().length ? Math.round(replies / appliedSet().length * 100) + "%" : "—", `${replies} replied`, "applied"],
      ["New in 24h", fresh, "matches, not skipped", "all"],
    ];
    const health = r ? (r.status === "success" ? "good" : r.status === "partial" ? "warn" : "bad") : "";
    const sources = (stats.sources || []).map((x) => `<span class="chip ${x.ok ? "good" : "bad"}">${esc(x.name)} · ${x.ok ? esc(String(x.inserted)) + " new" : "failed"}</span>`).join("");
    const steps = [
      ["Jobs seen", J.length + state.dup.length],
      ["Unique", J.length],
      ["Matched", J.filter((j) => j.status !== "skipped").length],
      ["Prepared", J.filter((j) => ["ready", "applied", "interview", "offer", "rejected"].includes(j.status)).length],
      ["Applied", appliedSet().length],
      ["Interview+", J.filter((j) => ["interview", "offer"].includes(j.status)).length],
    ];
    const max = Math.max(1, steps[0][1]);
    const parts = [qs.length ? `${qs.length} question${qs.length > 1 ? "s" : ""} to answer once` : "", drafts.length ? `${drafts.length} drafts to send` : "", manual.length ? `${manual.length} to apply yourself` : "", review.length ? `${review.length} to review` : ""].filter(Boolean).join(" · ");
    return `
      <div class="page-h"><h2>Today</h2><span class="hint">${esc(new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }))}</span></div>
      ${todo ? `<div class="callout"><span class="grow"><b>${todo} things need you.</b> ${esc(parts)}</span><a class="btn primary" href="#action">Open Needs action</a></div>` : `<div class="callout"><span class="grow"><b>Nothing is waiting for you.</b> The next <code>./agent.sh run</code> brings new jobs.</span></div>`}
      <div class="grid tiles">${tiles.map(([l, v, h, t]) => `<div class="tile link" data-go="${t}"><div class="label">${l}</div><div class="value">${esc(v)}</div><div class="hint">${h}</div></div>`).join("")}</div>
      <div class="grid two">
        <div class="panel"><h3>Last run</h3>
          ${r ? `<div class="sub"><span class="chip ${health}">${esc(r.status)}</span> ${esc(rel(r.finished_at || r.started_at))}${r.finished_at ? ` · took ${Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 60000)} min` : ""}</div>
          <div>${sources}</div>
          <div class="muted" style="margin-top:6px">${stats.items ? `${stats.items.processed} items read · ${stats.items.left} left for next run` : ""}${stats.llm ? ` · ${stats.llm.calls} model calls (${stats.llm.failed} failed)` : ""}${stats.companies_discovered ? ` · ${stats.companies_discovered} companies discovered` : ""}</div>
          ${r.error ? `<div class="reason" style="margin-top:8px">${esc(r.error)}</div>` : ""}` : `<div class="empty">No run yet: <code>./agent.sh run</code></div>`}
        </div>
        <div class="panel"><h3>Funnel</h3><div class="sub">From every job seen to interviews</div><div class="funnel">${steps.map(([k, n]) => `<div class="step"><span>${k}</span><span class="bar" style="width:${n / max * 100}%"></span><span class="num">${n}</span></div>`).join("")}</div></div>
      </div>
      <div class="panel"><h3>Applications per day</h3><div class="sub">Last 14 days</div><div class="chart" id="chart"></div></div>`;
  }

  function drawChart() {
    const el = $("chart"); if (!el) return;
    const data = state.stats?.applied_per_day || [];
    if (!data.some((d) => d.count)) { el.innerHTML = `<div class="empty">No applications yet.</div>`; return; }
    const W = el.clientWidth || 700, H = 140, pl = 26, pb = 20, pt = 6, max = Math.max(4, ...data.map((d) => d.count));
    const step = Math.ceil(max / 4), top = step * 4;
    const slot = (W - pl) / data.length, bw = Math.min(26, slot * .6), y = (v) => pt + (H - pb - pt) * (1 - v / top);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications per day">`;
    for (let v = 0; v <= top; v += step) s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
    data.forEach((d, i) => {
      const x = pl + slot * i + slot / 2;
      if (d.count) s += `<rect x="${x - bw / 2}" y="${y(d.count)}" width="${bw}" height="${y(0) - y(d.count)}" rx="3" fill="var(--accent)"><title>${esc(d.date)}: ${d.count}</title></rect>`;
      if (i % 2 === 0) s += `<text x="${x}" y="${H - 5}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(d.date.slice(5))}</text>`;
    });
    el.innerHTML = s + "</svg>";
  }

  // ---------------------------------------------------------------- Needs action
  const docs = (j) => `${j.files?.cv ? link(j.files.cv, "CV") : ""}${j.files?.cover ? link(j.files.cover, "Letter") : ""}${j.files?.form ? link(j.files.form, "Filled form") : ""}`;
  function jobCard(j, body, actions) {
    return `<div class="card">
      <div class="top"><div><div class="title" data-open="${j.id}">${esc(j.title)}</div><div class="muted">${company(j)}${j.location ? " · " + esc(j.location) : ""} · posted ${esc(rel(postedOf(j)))}</div></div><div style="text-align:right">${prio(j)}<div>${fit(j)}</div></div></div>
      ${body}
      <div class="row-actions">${actions}</div></div>`;
  }
  const questionRows = (qs) => qs.map((q) => `<div class="q"><div><b>${esc(q.question)}</b><div class="faint">asked ${q.times}× · last ${esc(rel(q.last_seen))} · saved as <code>${esc(q.suggested_key)}</code></div></div><input type="text" data-qinput="${q.id}" placeholder="Your answer" aria-label="Answer to ${esc(q.question)}"><button class="btn primary small" data-answer="${q.id}" data-key="${esc(q.suggested_key)}">Save</button></div>`).join("");

  function action() {
    const qs = state.profile?.questions || [];
    const drafts = state.jobs.filter(isDraft), manual = state.jobs.filter(isManual), review = by("needs_review"), queued = by("new");
    const sec = (title, hint, list, card, cmd) => `<div class="section-title"><h3>${title}</h3><span class="count">${list.length || ""}</span>${cmd ? `<span class="faint">${cmd}</span>` : ""}</div><div class="faint" style="margin:-6px 0 10px">${hint}</div>${list.length ? `<div class="cards">${list.map(card).join("")}</div>` : `<div class="empty">Nothing here.</div>`}`;
    return `<div class="page-h"><h2>Needs action</h2><span class="hint">Everything that waits for you, in the order to do it</span></div>
      ${qs.length ? `<div class="panel"><h3>Questions forms asked that your profile doesn't answer</h3><div class="sub">Answer each once. It's saved in your profile's ready answers, and the forms that stopped on it are retried on the next run.</div>${questionRows(qs)}</div>` : ""}
      ${sec("Email drafts to send", "Read them in Gmail Drafts; edit or delete any; then send them all at once.", drafts, (j) => jobCard(j, `<div class="reason">To ${esc(j.apply_email)}</div>`, `${link(j.gmail_draft_url, "Open draft", "btn small primary")}${docs(j)}<button class="btn small" data-status="${j.id}:applied">Mark sent</button>`), "<code>./agent.sh send</code>")}
      ${sec("Apply yourself", "Prepared but not submitted: a captcha, a sign-in, Easy Apply or an open question. <code>./agent.sh apply</code> opens each one pre-filled.", manual, (j) => jobCard(j, `<div class="reason">${esc(j.manual_reason || "apply on the site")}</div>`, `${link(j.apply_url_direct || j.apply_url, j.apply_url_direct ? "Company form" : "Open", "btn small primary")}${docs(j)}<button class="btn small good" data-status="${j.id}:applied">Mark applied</button>`), "<code>./agent.sh apply</code>")}
      ${sec("Needs review", "The agent stopped before preparing these: an eligibility condition, signs of a scam, or no way to apply.", review, (j) => jobCard(j, `<div class="reason">${esc(j.skip_reason || "check")}${(j.flags || []).length ? " · " + j.flags.map(esc).join(", ") : ""}</div>`, `<button class="btn small primary" data-status="${j.id}:new">Prepare anyway</button><button class="btn small" data-status="${j.id}:skipped">Skip</button>${link(j.apply_url, "Listing")}`))}
      ${queued.length ? sec("Queued for the next run", "Prepared by the next <code>./agent.sh run</code>, or now with <code>./agent.sh redo &lt;id&gt;</code>.", queued, (j) => jobCard(j, `<div class="faint">job ${j.id}</div>`, `<button class="btn small" data-status="${j.id}:skipped">Unqueue</button>`)) : ""}`;
  }

  // ---------------------------------------------------------------- Applied board
  function applied() {
    const cols = [["applied", "Applied"], ["interview", "Interview"], ["offer", "Offer"], ["rejected", "Rejected"]];
    const card = (j) => `<div class="mini" draggable="true" data-drag="${j.id}"><div class="title" data-open="${j.id}">${esc(j.title)}</div><div class="faint">${company(j)}</div>
      <div class="faint">${j.has_reply ? `<span class="chip good">reply</span>` : ""}${esc(j.app_mode === "submitted" ? "form submitted" : j.apply_channel === "email" ? "email" : "applied")} · ${esc(rel(j.applied_at || j.posted_at))}</div></div>`;
    return `<div class="page-h"><h2>Applied</h2><span class="hint">Drag a card when a company answers. Replies to your emails are detected on each run.</span></div>
      <div class="board">${cols.map(([k, l]) => { const list = by(k); return `<div class="col" data-col="${k}"><h4>${l}<span class="count">${list.length || ""}</span></h4>${list.map(card).join("") || `<div class="faint" style="padding:6px">Drop cards here</div>`}</div>`; }).join("")}</div>`;
  }

  // ---------------------------------------------------------------- Skipped
  function skipped() {
    const list = by("skipped").concat(state.showDup ? state.dup : []);
    const groups = {};
    for (const j of list) (groups[j.skip_reason || "other"] ||= []).push(j);
    const order = Object.keys(SKIP).filter((k) => groups[k]).concat(Object.keys(groups).filter((k) => !SKIP[k]));
    return `<div class="page-h"><h2>Skipped</h2><span class="hint">What the agent didn't apply to, and why. Rescue anything it missed: "Prepare anyway" queues it for the next run.</span></div>
      <div class="filters"><label class="faint"><input type="checkbox" id="showdup" ${state.showDup ? "checked" : ""}> show duplicates (${state.dup.length})</label></div>
      ${order.length ? order.map((k) => `<details class="group" ${["low_fit"].includes(k) ? "open" : ""}><summary><b>${esc((SKIP[k] || [k])[0])}</b><span class="count">${groups[k].length}</span><span class="what">${esc((SKIP[k] || ["", ""])[1])}</span></summary>
        ${groups[k].sort((a, b) => (b.fit_score ?? -1) - (a.fit_score ?? -1)).map((j) => `<div class="li"><div><span class="title" data-open="${j.id}">${esc(j.title)}</span> <span class="muted">${company(j)}</span><div class="faint">${fit(j)} · posted ${esc(rel(postedOf(j)))} · ${esc(SOURCE[j.source] || j.source)}</div></div>
          <div class="row-actions">${link(j.apply_url_direct || j.apply_url, "Listing")}${j.skip_reason !== "duplicate" ? `<button class="btn small primary" data-status="${j.id}:new">Prepare anyway</button>` : ""}</div></div>`).join("")}</details>`).join("") : `<div class="empty">Nothing skipped.</div>`}`;
  }

  // ---------------------------------------------------------------- All jobs
  function all() {
    const q = state.q.toLowerCase();
    const rows = state.jobs.filter((j) => (!state.status || j.status === state.status) && (!state.source || j.source === state.source || (state.source === "whatsapp" && j.source === "whatsapp_export"))
      && (!q || [j.title, j.company, j.location, j.apply_email, j.source_name, j.notes].join(" ").toLowerCase().includes(q)));
    const key = { posted: (j) => postedOf(j) || "", fit: (j) => j.fit_score ?? -1, title: (j) => j.title.toLowerCase(), status: (j) => j.status, prio: (j) => j.priority ?? 9 }[state.sort.k];
    rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * state.sort.d);
    const opt = (v, l, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`;
    const arrow = (k) => state.sort.k === k ? (state.sort.d > 0 ? " ↑" : " ↓") : "";
    return `<div class="page-h"><h2>All jobs</h2><span class="hint">${rows.length} shown · press / to search</span></div>
      <div class="filters">
        <input type="search" id="q" placeholder="Search title, company, email, notes…" value="${esc(state.q)}">
        <select id="fstatus">${opt("", "Any status", state.status)}${Object.entries(STATUS).map(([k, v]) => opt(k, v.label, state.status)).join("")}</select>
        <select id="fsource">${opt("", "Any source", state.source)}${["whatsapp", "alert_email", "ats", "manual"].map((k) => opt(k, SOURCE[k], state.source)).join("")}</select>
      </div>
      <div class="panel" style="padding:0;overflow-x:auto"><table><thead><tr>
        <th data-sort="prio">Pri${arrow("prio")}</th><th data-sort="title">Role${arrow("title")}</th><th data-sort="posted">Posted${arrow("posted")}</th><th data-sort="fit">Fit${arrow("fit")}</th><th data-sort="status">Status${arrow("status")}</th><th>Source</th></tr></thead>
        <tbody>${rows.map((j) => `<tr class="r" data-open="${j.id}"><td>${prio(j)}</td><td><b>${esc(j.title)}</b><div class="muted">${company(j)}${j.location ? " · " + esc(j.location) : ""}</div></td>
          <td class="muted">${esc(rel(postedOf(j)))}</td><td>${fit(j)}</td><td><span class="dot" style="background:${STATUS[j.status]?.color}"></span>${esc(STATUS[j.status]?.label || j.status)}${j.has_reply ? ` <span class="chip good">reply</span>` : ""}</td><td class="muted">${esc(SOURCE[j.source] || j.source)}</td></tr>`).join("") || `<tr><td colspan="6"><div class="empty">No jobs match.</div></td></tr>`}</tbody></table></div>`;
  }

  // ---------------------------------------------------------------- Profile
  function profile() {
    const p = state.profile;
    if (!p) return `<div class="empty">Profile not available.</div>`;
    const qs = p.questions || [];
    const answers = Object.entries(p.answers || {});
    return `<div class="page-h"><h2>Profile</h2><span class="hint">What every CV, letter and form answer is built from</span></div>
      <div class="grid two">
        <div class="panel"><h3>${esc(p.candidate.full_name)}</h3><div class="sub">${esc(p.candidate.location)}</div>
          <div class="kv" style="grid-template-columns:90px 1fr">
            <span class="k">Email</span><span>${esc(p.candidate.email)}</span><span class="k">Phone</span><span>${esc(p.candidate.phone)}</span>
            ${Object.entries(p.candidate.links || {}).map(([k, u]) => `<span class="k">${esc(k)}</span><span>${link(u, u, "")}</span>`).join("")}</div>
          <div>${["projects", "experience", "certifications", "skills", "not_held"].map((k) => `<span class="chip">${esc(p.counts[k])} ${esc(k.replace("_", " "))}</span>`).join("")}</div>
          <div class="faint" style="margin-top:6px">Facts, projects and skills live in <code>profile/master_profile.yaml</code>; every CV is checked against it.</div>
        </div>
        <div class="panel"><h3>Questions waiting for an answer <span class="count ${qs.length ? "hot" : ""}">${qs.length || ""}</span></h3><div class="sub">Asked by application forms; answered once, used on every form after.</div>
          ${qs.length ? questionRows(qs) : `<div class="empty">None. Every question so far had an answer.</div>`}
        </div>
      </div>
      <div class="panel answers"><h3>Ready answers</h3><div class="sub">Used to fill application forms. Saved straight into your profile file; the previous version is kept as <code>master_profile.yaml.bak</code>.</div>
        ${answers.map(([k, v]) => `<div class="a"><code>${esc(k)}</code><input type="text" data-akey="${esc(k)}" value="${esc(v)}" aria-label="${esc(k)}"><span class="row-actions"><button class="btn small primary" data-asave="${esc(k)}">Save</button><button class="btn small" data-adel="${esc(k)}">Remove</button></span></div>`).join("")}
        <div class="a"><input type="text" id="newkey" placeholder="new_key, e.g. graduation_year"><input type="text" id="newval" placeholder="answer"><button class="btn small" id="addanswer">Add</button></div>
      </div>
      <div class="panel"><h3>CV headlines and summaries</h3><div class="sub">One per angle; the agent picks the angle from the job title. Edit them in the profile file.</div>
        ${Object.keys(p.headlines || {}).map((a) => `<details style="margin:6px 0"><summary><b>${esc(a)}</b> · <span class="muted">${esc(p.headlines[a])}</span></summary><p class="muted">${esc(p.summaries[a])}</p></details>`).join("")}
        <div style="margin-top:10px">${(p.certifications || []).map((c) => `<span class="chip accent">${esc(c)}</span>`).join("")}</div>
      </div>`;
  }

  // ---------------------------------------------------------------- Companies, Runs
  function companies() {
    const cs = state.stats?.companies || [];
    return `<div class="page-h"><h2>Companies</h2><span class="hint">Boards polled every run: from your config, and found automatically from job links</span></div>
      ${cs.length ? `<div class="cards">${cs.map((c) => `<div class="card"><div class="top"><b>${esc(c.name)}</b><span class="chip ${c.source === "discovered" ? "accent" : ""}">${esc(c.source)}</span></div>
        <div class="muted">${esc(c.ats)} · ${esc(c.board || c.url || "")}${c.active ? "" : ` <span class="chip bad">off: failing</span>`}</div><div class="faint">${esc(c.evidence || "from config/companies.yaml")}</div></div>`).join("")}</div>` : `<div class="empty">None yet. They appear when a job link leads to a company's ATS.</div>`}`;
  }
  function runs() {
    return `<div class="page-h"><h2>Runs</h2><span class="hint">Every run of the agent, newest first</span></div>
      <div class="panel" style="padding:0;overflow-x:auto"><table><thead><tr><th>#</th><th>When</th><th>Status</th><th>Took</th><th>Items</th><th>Applications</th><th>Model calls</th><th>Note</th></tr></thead><tbody>
      ${state.runs.map((r) => { const s = r.stats || {}; const a = s.applications || {}; return `<tr><td>${r.id}</td><td class="muted">${esc(new Date(r.started_at).toLocaleString())}${r.mode === "dry_run" ? ` <span class="chip">dry run</span>` : ""}</td>
        <td><span class="chip ${r.status === "success" ? "good" : r.status === "partial" ? "warn" : "bad"}">${esc(r.status)}</span></td>
        <td class="muted">${r.finished_at ? Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 60000) + " min" : "—"}</td>
        <td class="muted">${s.items ? `${s.items.processed} read, ${s.items.left} left` : "—"}</td>
        <td class="muted">${s.applications ? `${a.drafts || 0} drafts, ${a.submitted || 0} submitted, ${a.packages || 0} yourself` : "—"}</td>
        <td class="muted">${s.llm ? `${s.llm.calls} (${s.llm.failed} failed)` : "—"}</td><td class="faint">${esc(r.error || "")}</td></tr>`; }).join("") || `<tr><td colspan="8"><div class="empty">No runs yet.</div></td></tr>`}</tbody></table></div>`;
  }

  // ---------------------------------------------------------------- drawer
  function openDrawer(id) {
    const j = state.jobs.find((x) => x.id === id) || state.dup.find((x) => x.id === id); if (!j) return;
    state.open = id;
    const chips = (arr, cls) => (arr || []).map((x) => `<span class="chip ${cls}">${esc(x)}</span>`).join("");
    const sel = `<select id="dstatus" aria-label="Status">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === j.status ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select>`;
    const editable = j.cover_text && !["applied", "interview", "offer", "rejected"].includes(j.status);
    $("drawer").innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px"><div><h2>${esc(j.title)}</h2><div class="muted">${company(j)}${j.location ? " · " + esc(j.location) : ""}${j.work_mode && j.work_mode !== "unknown" ? " · " + esc(j.work_mode) : ""}</div></div><button class="btn small" id="dclose">Close (Esc)</button></div>
      <div class="row-actions" style="margin:12px 0">${link(j.apply_url_direct, "Company form", "btn small primary")}${link(j.apply_url, "Listing")}${link(j.gmail_draft_url, "Gmail draft")}${docs(j)}${j.files?.cv_md ? link(j.files.cv_md, "CV text") : ""}</div>
      <div class="kv">
        <span class="k">Status</span><span>${sel}</span>
        <span class="k">Fit</span><span>${fit(j)} ${j.scores ? `<span class="faint">skills ${j.scores.skills} · experience ${j.scores.experience}</span>` : ""} ${prio(j)}</span>
        <span class="k">Posted</span><span>${esc(rel(postedOf(j)))}${j.job_posted_at ? "" : ` <span class="faint">(date of the post or alert)</span>`}</span>
        <span class="k">Found via</span><span>${esc(SOURCE[j.source] || j.source)}${j.source_name ? " · " + esc(j.source_name) : ""}${j.seen_count > 1 ? ` · seen ${j.seen_count}×` : ""}</span>
        <span class="k">Apply via</span><span>${esc(j.apply_channel)}${j.apply_email ? " · " + esc(j.apply_email) : ""}${j.apply_phone ? " · " + esc(j.apply_phone) : ""}</span>
        ${j.skip_reason ? `<span class="k">Reason</span><span>${esc(j.skip_reason)}</span>` : ""}
        ${j.manual_reason ? `<span class="k">Why by hand</span><span>${esc(j.manual_reason)}</span>` : ""}
        ${j.company_board ? `<span class="k">Company board</span><span>${esc(j.company_board)}</span>` : ""}
        ${j.ats_keywords != null ? `<span class="k">CV keywords</span><span>${Math.round(j.ats_keywords * 100)}% of the job's backed keywords</span>` : ""}
      </div>
      <div class="row-actions">${["skipped", "needs_review"].includes(j.status) ? `<button class="btn small primary" data-status="${j.id}:new">Prepare anyway</button>` : ""}${j.status === "ready" ? `<button class="btn small good" data-status="${j.id}:applied">Mark applied</button>` : ""}</div>
      ${j.why_this_role ? `<h4>Why this role (your interview line)</h4><div class="reason">${esc(j.why_this_role)}</div>` : ""}
      ${j.fit_summary ? `<h4>Fit</h4><div>${esc(j.fit_summary)}</div>` : ""}
      ${(j.matched || []).length || (j.missing || []).length ? `<h4>Requirements</h4><div>${chips(j.matched, "good")}${chips(j.missing, "bad")}</div>` : (j.requirements || []).length ? `<h4>Requirements</h4><div>${chips(j.requirements, "")}</div>` : ""}
      ${(j.form_filled || []).length ? `<h4>What the agent filled in the form</h4><div class="kv">${j.form_filled.map((f) => `<span class="k">${esc(f.label)}</span><span>${esc(f.value)}</span>`).join("")}</div>${(j.form_unanswered || []).length ? `<div class="reason">Left for you: ${j.form_unanswered.map(esc).join("; ")}</div>` : ""}` : ""}
      ${j.cover_text ? `<h4>Cover letter</h4><textarea id="dcover" rows="14" ${editable ? "" : "disabled"} aria-label="Cover letter">${esc(j.cover_text)}</textarea>
        <div class="row-actions" style="margin-top:6px">${editable ? `<button class="btn small primary" id="dsavecover">Save letter</button>` : ""}<button class="btn small" id="dcopy">Copy</button><span class="faint">${j.apply_channel === "email" ? "Email jobs: the Gmail draft is what gets sent; edit it there." : "Used by ./agent.sh apply and for paste boxes."}</span></div>` : ""}
      <h4>Notes</h4><textarea id="dnotes" rows="3" placeholder="Interview date, contact, follow-up…" aria-label="Notes">${esc(j.notes || "")}</textarea><div style="margin-top:6px"><button class="btn small" id="dsavenotes">Save notes</button></div>
      ${j.post_text ? `<h4>Original post</h4><pre class="post">${esc(j.post_text)}</pre>` : ""}`;
    $("drawer").classList.add("open"); $("scrim").classList.add("open");
  }
  function closeDrawer() { state.open = null; $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }

  // ---------------------------------------------------------------- answers
  async function saveAnswer(key, value, questionId) {
    try {
      const r = await api("/api/profile/answers", { method: "PUT", body: JSON.stringify({ key, value, ...(questionId ? { question_id: questionId } : {}) }) });
      state.profile.answers = r.answers; state.profile.questions = r.questions;
      toast(value ? `Saved "${key}"${questionId ? ". Waiting forms are retried on the next run" : ""}` : `Removed "${key}"`);
      render();
    } catch (e) { toast(`Not saved: ${e.message}`); }
  }

  // ---------------------------------------------------------------- events
  document.addEventListener("click", (e) => {
    const t = e.target;
    const go = t.closest("[data-go]"); if (go) { location.hash = go.dataset.go; return; }
    const st = t.closest("[data-status]");
    if (st) { const [id, s] = st.dataset.status.split(":"); patch(+id, { status: s }, s === "new" ? `Queued: the next run prepares it (or ./agent.sh redo ${id})` : `Moved to ${STATUS[s].label}`); return; }
    const op = t.closest("[data-open]"); if (op && !t.closest("a, button, select, input")) { openDrawer(+op.dataset.open); return; }
    const an = t.closest("[data-answer]");
    if (an) { const v = document.querySelector(`[data-qinput="${an.dataset.answer}"]`).value.trim(); if (!v) return toast("Type an answer first"); saveAnswer(an.dataset.key, v, +an.dataset.answer); return; }
    const as = t.closest("[data-asave]"); if (as) { saveAnswer(as.dataset.asave, document.querySelector(`[data-akey="${CSS.escape(as.dataset.asave)}"]`).value); return; }
    const ad = t.closest("[data-adel]"); if (ad) { if (confirm(`Remove the answer "${ad.dataset.adel}"?`)) saveAnswer(ad.dataset.adel, ""); return; }
    if (t.id === "addanswer") { const k = $("newkey").value.trim(), v = $("newval").value.trim(); if (!k || !v) return toast("Fill in both the key and the answer"); saveAnswer(k, v); return; }
    if (t.id === "dclose") return closeDrawer();
    if (t.id === "dsavecover") return patch(state.open, { cover_text: $("dcover").value });
    if (t.id === "dsavenotes") return patch(state.open, { notes: $("dnotes").value }, "Notes saved");
    if (t.id === "dcopy") { navigator.clipboard?.writeText($("dcover").value).then(() => toast("Letter copied"), () => toast("Copy failed: select the text and copy")); return; }
    const th = t.closest("th[data-sort]"); if (th) { const k = th.dataset.sort; state.sort = { k, d: state.sort.k === k ? -state.sort.d : -1 }; render(); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "dstatus") return patch(state.open, { status: t.value }, `Moved to ${STATUS[t.value].label}`);
    if (t.id === "fstatus") { state.status = t.value; render(); }
    if (t.id === "fsource") { state.source = t.value; render(); }
    if (t.id === "showdup") { state.showDup = t.checked; render(); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id !== "q") return;
    state.q = e.target.value; const pos = e.target.selectionStart; render();
    const q = $("q"); q.focus(); q.setSelectionRange(pos, pos);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); location.hash = "all"; setTimeout(() => $("q")?.focus(), 0); }
    if (e.key === "Enter" && e.target.dataset?.qinput) document.querySelector(`[data-answer="${e.target.dataset.qinput}"]`)?.click();
  });
  // Applied board: drag a card to another column.
  document.addEventListener("dragstart", (e) => { const c = e.target.closest?.("[data-drag]"); if (c) e.dataTransfer.setData("text/plain", c.dataset.drag); });
  document.addEventListener("dragover", (e) => { const col = e.target.closest?.("[data-col]"); if (col) { e.preventDefault(); col.classList.add("drop"); } });
  document.addEventListener("dragleave", (e) => { e.target.closest?.("[data-col]")?.classList.remove("drop"); });
  document.addEventListener("drop", (e) => {
    const col = e.target.closest?.("[data-col]"); if (!col) return;
    e.preventDefault(); col.classList.remove("drop");
    const id = +e.dataTransfer.getData("text/plain");
    if (id) patch(id, { status: col.dataset.col }, `Moved to ${STATUS[col.dataset.col].label}`);
  });

  function route() { state.tab = (location.hash || "#today").slice(1) || "today"; closeDrawer(); render(); window.scrollTo(0, 0); }
  window.addEventListener("hashchange", route);
  $("scrim").addEventListener("click", closeDrawer);
  $("refresh").addEventListener("click", () => load().then(() => toast("Refreshed")));
  try { const th = localStorage.getItem("jt-theme"); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
  $("theme").addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("jt-theme", document.documentElement.dataset.theme); } catch (_) {}
  });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => state.tab === "today" && drawChart(), 150); });
  state.tab = (location.hash || "#today").slice(1) || "today";
  load();
  setInterval(() => { if (!state.open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) load(); }, 120000);
})();
</script>
</body>
</html>
