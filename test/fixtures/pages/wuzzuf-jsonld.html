<script data-rh="true" type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Junior System Administrator","description":"\n        \u003csection\u003e\n            \u003ch1\u003eJob Description\u003c/h1\u003e\n            \u003cp\u003eRAY Technologies provides IoT, AI video telematics, and fleet solutions. We run three online platforms on the cloud in Egypt, and we need someone to make sure they stay up and running.\u003c/p\u003e\u003cp\u003eYou will be the person who watches our systems and knows who to call when something goes wrong.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eYour daily work:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eCheck that our platforms, servers, and websites are working\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSpot problems early, before our customers do\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBe the first contact when something stops working, and follow up with our technical partners until it's fixed\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eKeep track of our domain names, website security certificates (SSL), and their renewal dates\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDo basic server tasks: manage users, backups, updates, and logs\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWrite down every problem and how it was solved\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eKeep a clear list of our systems, accounts, and partner contacts\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\n        \u003c/section\u003e\n        \u003csection\u003e\n            \u003ch1\u003eJob Requirements\u003c/h1\u003e\n            \u003cul\u003e\u003cli\u003e\u003cp\u003e1 to 3 years of experience in system administration or IT support.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGood basics in Linux (Ubuntu, Redhat, Rocky)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGood basics in networking (DNS, ports, firewalls)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBasic knowledge of web servers and cloud hosting\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGood English and Arabic, spoken and written\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCalm when problems happen, and takes ownership until they're solved\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAble to be reached outside working hours during serious problems\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExperience in monitoring tools (Zabbix, Grafana, UptimeRobot), Bash or Python scripting, AWS basics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBasic knowledge of ticketing systems (Jira/Zendesk/Zoho)\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\n        \u003c/section\u003e\n    ","image":"https://images.wuzzuf-data.net/files/company_logo/145141829869835f42103ec.png","datePosted":"2026-10-01T16:48:04.000Z","validThrough":"2026-11-30T16:48:04.000Z","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"RayC Technologies  ","sameAs":"https://wuzzuf.net/jobs/careers/RayC Technologies-Egypt-127492","logo":"https://images.wuzzuf-data.net/files/company_logo/145141829869835f42103ec.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressRegion":"Cairo","addressLocality":"Maadi","addressCountry":"EG"}},"directApply":true}</script>
