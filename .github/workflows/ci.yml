# CI: lint, typecheck, tests (real PDF rendering needs poppler + puppeteer's Chrome),
# build, shellcheck for the scripts, and a dependency audit. No secrets are used.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System packages (PDF checks)
        # Ubuntu's mirrors fail now and then (run for a8f5ad6): retry before failing the build.
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils && exit 0
            sleep 20
          done
          exit 1
      # Ubuntu 24.04 blocks unprivileged user namespaces (AppArmor), which Chrome's sandbox
      # needs; puppeteer's documented fix for CI runners.
      - name: Allow Chrome's sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: shellcheck
        run: shellcheck agent.sh scripts/*.sh .githooks/pre-commit
      - name: Audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit findings (see docs/dev/decisions.md D22 for accepted ones)"
